<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedrock Operations: Monitoring, Evaluation & Model Customization</title>
    <style>
        /* --- Base Styles --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; padding: 30px; color: #333; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        
        h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; font-size: 1.8em; }
        
        /* --- Score Board Style --- */
        .score-board {
            display: flex; justify-content: space-around; background: white;
            padding: 15px; margin-bottom: 25px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e1e4e8;
        }
        .score-item { text-align: center; }
        .score-val { font-size: 1.5em; font-weight: bold; display: block; }
        .score-lbl { font-size: 0.85em; color: #7f8c8d; text-transform: uppercase; font-weight: 600; }
        
        .c-purple { color: #8e44ad; }
        .c-green { color: #27ae60; }
        .c-red { color: #e74c3c; }
        .c-grey { color: #7f8c8d; }

        .btn-reset-container { text-align: center; margin-bottom: 30px; }
        .btn-reset { 
            background-color: #34495e; color: white; border: none; padding: 8px 16px; 
            border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; 
            transition: 0.2s; 
        }
        .btn-reset:hover { background-color: #2c3e50; }

        /* --- Question Card --- */
        .question-card { 
            background: white; padding: 25px; margin-bottom: 25px; 
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid #e1e4e8; 
        }

        .q-header { font-weight: 700; color: #7f8c8d; margin-bottom: 15px; font-size: 0.9em; text-transform: uppercase; }
        .q-body { font-size: 1.2em; margin-bottom: 20px; color: #2c3e50; font-weight: 500; }
        
        /* Images */
        .question-card img, .feedback-text img, .overall-explanation img {
            max-width: 100% !important; height: auto !important; display: block;
            margin: 15px auto; border-radius: 6px; cursor: zoom-in;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .q-answers { list-style: none; padding: 0; }
        
        /* --- Option Styles --- */
        .option { 
            padding: 15px 20px; border: 2px solid #e1e4e8; margin-bottom: 12px; border-radius: 8px; 
            cursor: pointer; transition: all 0.2s ease; background: white; 
            display: flex; flex-direction: column;
        }
        
        .option-content { display: flex; align-items: flex-start; gap: 15px; width: 100%; }

        .option:hover:not(.answered) { border-color: #bdc3c7; background-color: #f8f9fa; }
        .option.selected:not(.answered) { border-color: #34495e; background-color: #edf2f7; }
        
        /* Icons */
        .chk { 
            font-size: 1.1em; flex-shrink: 0; width: 24px; height: 24px; 
            display: flex; align-items: center; justify-content: center; 
            border: 2px solid #bdc3c7; background: white; margin-top: 2px;
        }
        .chk.radio { border-radius: 50%; }
        .chk.checkbox { border-radius: 4px; }
        
        .option.selected .chk { border-color: #2c3e50; background: #2c3e50; }
        .option.selected .chk::after { content: ''; display: block; width: 10px; height: 10px; background: white; border-radius: 50%; }

        /* --- Feedback Section --- */
        .feedback-text {
            margin-top: 15px; padding: 12px 15px; font-size: 0.95em;
            border-left: 4px solid; background-color: rgba(255,255,255,0.5);
            border-radius: 0 4px 4px 0; animation: fadeIn 0.3s ease;
            display: none;
        }
        .feedback-text:empty { display: none !important; }

        /* --- Overall Explanation Section --- */
        .overall-explanation {
            display: none; margin-top: 25px; padding: 20px;
            background-color: #f0f7ff; border: 1px solid #cce5ff;
            border-radius: 8px; color: #333; animation: fadeIn 0.5s ease;
            overflow-wrap: break-word; 
        }
        .overall-explanation h4 {
            margin: 0 0 10px 0; color: #0056b3; font-size: 1em;
            text-transform: uppercase; font-weight: 700;
        }

        /* --- States After Submit --- */
        .option.user-wrong { border-color: #e74c3c; background-color: #fdecea; cursor: default; }
        .option.user-wrong .chk { border-color: #e74c3c; background: #e74c3c; }
        .option.user-wrong .chk::after { content: '✕'; color: white; background: none; font-size: 16px; font-weight: bold; width: auto; height: auto; }
        .option.user-wrong .feedback-text { display: block; border-color: #c0392b; color: #c0392b; background-color: rgba(231, 76, 60, 0.1); }

        .option.show-correct { border-color: #27ae60; background-color: #e8f8f5; cursor: default; }
        .option.show-correct .chk { border-color: #27ae60; background: #27ae60; }
        .option.show-correct .chk::after { content: '✓'; color: white; background: none; font-size: 16px; font-weight: bold; width: auto; height: auto; }
        .option.show-correct .feedback-text { display: block; border-color: #27ae60; color: #1e8449; background-color: rgba(39, 174, 96, 0.1); font-weight: 500; }

        .btn-submit-container { margin-top: 20px; }
        .btn-submit { background-color: #2980b9; color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; }
        .btn-submit:hover { background-color: #2471a3; }
        .btn-submit:disabled { opacity: 0.7; cursor: default; }

        /* Modal Zoom */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 90vh; }
        .close { position: absolute; top: 15px; right: 35px; color: #fff; font-size: 40px; cursor: pointer; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bedrock Operations: Monitoring, Evaluation & Model Customization</h1>
        
        <div class="score-board">
            <div class="score-item">
                <span class="score-val c-purple" id="val-score">0%</span>
                <span class="score-lbl">Score</span>
            </div>
            <div class="score-item">
                <span class="score-val c-green" id="val-correct">0</span>
                <span class="score-lbl">Correct</span>
            </div>
            <div class="score-item">
                <span class="score-val c-red" id="val-wrong">0</span>
                <span class="score-lbl">Wrong</span>
            </div>
            <div class="score-item">
                <span class="score-val c-grey" id="val-remain">0</span>
                <span class="score-lbl">Remaining</span>
            </div>
        </div>

        <div class="btn-reset-container">
            <button class="btn-reset" onclick="resetQuiz()">Reset Quiz</button>
        </div>
        <div id="questions-container"></div>
    </div>

    <div id="imageModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="img01">
    </div>

    <script>
        const quizData = {"quiz_title":"Bedrock Operations: Monitoring, Evaluation & Model Customization","questions":[{"_class":"assessment","id":144710585,"assessment_type":"multiple-choice","created":"2026-01-22T09:48:47Z","prompt":{"question":"<p>A company is evaluating multiple foundation models in <strong>Amazon Bedrock</strong> for two different generative AI use cases:</p><p><strong>Use case A:</strong> Extracting a fixed set of fields (e.g., invoice number, date, total amount) from structured documents where correct outputs are known and labelled</p><p><strong>Use case B:</strong> Generating executive summaries of quarterly financial reports, where output quality depends on coherence, completeness, and readability—and no single 'correct' summary exists.</p><p>The company wants to use <strong>Amazon Bedrock Model Evaluation</strong> and minimize custom evaluation code.</p><p>Which approach BEST meets the evaluation requirements for both use cases?</p>","relatedLectureIds":["53749755"],"feedbacks":["","<p>Programmatic evaluation fits tasks with clear, labeled answers like classification or extraction. LLM‑as‑a‑judge is better for subjective outputs such as summaries or reasoning quality where no ground truth exists.</p>","",""],"answers":["<p>Use LLM-as-a-judge for both use cases to ensure consistent qualitative scoring across all outputs.</p>","<p>Use programmatic evaluation for Use case A and LLM-as-a-judge for Use case B.</p>","<p>Use programmatic evaluation for both use cases to ensure objective and repeatable results.</p>","<p>Use LLM-as-a-judge for Use case A and manual human review for Use case B.</p>"]},"correct_response":["b"],"updated":"2026-01-25T05:46:21Z","section":""},{"_class":"assessment","id":144711109,"assessment_type":"multiple-choice","created":"2026-01-22T09:51:06Z","prompt":{"question":"<p>A company is using Amazon Bedrock to build a generative AI assistant that produces internal engineering summaries. While the base foundation model generates accurate content, the responses do not consistently follow the company’s domain-specific terminology, writing conventions, and structured formatting.</p><p>The company has a curated dataset of internal documents that reflect the desired output style. The company wants to:</p><p>- Adapt the model’s behaviour and language style</p><p>- Minimize training and inference costs</p><p>- Avoid full model retraining and large operational overhead</p><p>Which model customization approach BEST meets these requirements?</p>","relatedLectureIds":["54483547"],"feedbacks":["","","<p>LoRA is a parameter‑efficient fine‑tuning method&nbsp; that adds small trainable layers so the model can learn domain‑specific style and terminology at low cost. It adapts behavior permanently without the expense of full fine‑tuning. Other options fall short: prompt engineering doesn’t change model behavior, knowledge injection suits factual gaps not style, and full fine‑tuning is costly. Use LoRA when you need efficient style or domain adaptation.</p>",""],"answers":["<p>Use prompt engineering with detailed system prompts, few-shot examples, and style guidelines included in every request—requiring no training or additional infrastructure.</p>","<p>Use retrieval-augmented generation (RAG) to inject internal documents into the prompt at inference time.</p>","<p>Fine-tune the foundation model using LoRA-based parameter-efficient fine-tuning (PEFT) with the curated internal dataset.</p>","<p>Train a new foundation model from scratch using the internal document corpus.</p>"]},"correct_response":["c"],"updated":"2026-01-25T05:46:21Z","section":""},{"_class":"assessment","id":144713465,"assessment_type":"multiple-choice","created":"2026-01-22T10:00:17Z","prompt":{"question":"<p>A company wants to build a public, event-driven generative AI API that invokes Amazon Bedrock. Requests arrive as HTTP events in unpredictable bursts. The solution must scale automatically, keep latency and cost low, and require minimal infrastructure management.</p><p>Which combination of AWS services BEST meets these requirements?</p>","relatedLectureIds":"","feedbacks":["","<p>HTTP API + Lambda is ideal for event‑driven Bedrock calls. HTTP APIs offer lower cost and latency, while Lambda scales automatically for bursty, stateless requests with no infrastructure to manage. Other options add unnecessary overhead: REST APIs cost more, Fargate requires container management, and ALB + EC2 needs servers and scaling groups, making them less efficient for this serverless use case.</p>","",""],"answers":["<p>Amazon API Gateway REST API with AWS Lambda </p>","<p>Amazon API Gateway HTTP API with AWS Lambda</p>","<p>Amazon API Gateway HTTP API with AWS Fargate</p>","<p>Application Load Balancer with Amazon EC2 Auto Scaling</p>"]},"correct_response":["b"],"updated":"2026-01-25T05:46:21Z","section":""},{"_class":"assessment","id":144713989,"assessment_type":"multiple-choice","created":"2026-01-22T10:02:09Z","prompt":{"question":"<p>A company is launching a customer-facing AI assistant using Amazon Bedrock. The business wants a chat-like experience where responses appear incrementally, updates are pushed to users without repeated requests, and the system scales automatically with active users.</p><p>Which API solution BEST meets these requirements?</p>","relatedLectureIds":"","feedbacks":["","","<p>A chat-like experience needs persistent, bidirectional connections and server‑pushed streaming. API Gateway WebSocket APIs support this and integrate easily with Lambda. The Lambda function would use <code>InvokeModelWithResponseStream</code> API to receive tokens from Bedrock incrementally, then push each token to the client via the WebSocket Management API. Other options fail: HTTP and REST APIs are request/response only, and ALB + EC2 supports long connections but requires heavy server and scaling management.</p>",""],"answers":["<p>Amazon API Gateway HTTP API with AWS Lambda, returning the full response after Bedrock completes generation.</p>","<p>Amazon API Gateway REST API with AWS Lambda, using synchronous request/response patterns.</p>","<p>Amazon API Gateway WebSocket API with AWS Lambda, maintaining persistent connections.</p>","<p>Application Load Balancer with Amazon EC2 Auto Scaling, handling long-lived connections.</p>"]},"correct_response":["c"],"updated":"2026-01-25T05:46:21Z","section":""},{"_class":"assessment","id":144713999,"assessment_type":"multiple-choice","created":"2026-01-22T10:03:30Z","prompt":{"question":"<p>A company uses Amazon Bedrock to power a customer-facing generative AI application. The current solution relies on a large, highly capable foundation model that produces high-quality responses but has high latency and inference cost.</p><p>The company wants to:</p><p>- Retain response quality close to the large model</p><p>- Reduce inference latency and cost in production</p><p>- Avoid collecting a large, manually labelled training dataset</p><p>- Use a fully managed customization approach</p><p>Which model customization approach BEST meets these requirements?</p>","relatedLectureIds":["54461723"],"feedbacks":["","<p>Model distillation trains a smaller student model using outputs from a larger teacher model, giving near‑teacher accuracy with lower latency and cost, and without needing large labeled datasets. Other options fall short: fine‑tuning keeps the large model and its cost, prompt tuning doesn’t change model size or speed, and embeddings can’t generate conversational responses. Distillation is ideal when you want faster, cheaper inference with strong accuracy.</p>","",""],"answers":["<p>Fine-tune the large foundation model using a labelled dataset to improve accuracy while keeping the same model size.</p>","<p>Use model distillation capability in Amazon Bedrock to transfer knowledge from the large teacher model to a smaller student model using generated responses.</p>","<p>Apply prompt engineering and reduce temperature and top-p values for the small language model in Amazon Bedrock to make responses faster and lower the cost.</p>","<p>Train an Bedrock embeddings model and replace the generative model with vector similarity search.</p>"]},"correct_response":["b"],"updated":"2026-01-25T05:46:21Z","section":""},{"_class":"assessment","id":144709545,"assessment_type":"multiple-choice","created":"2026-01-22T09:46:36Z","prompt":{"question":"<p>A company operates a customer-facing generative AI application using Amazon Bedrock.</p><p>Recently, the operations team noticed two problems during peak usage hours:</p><p>- Response latency increases, causing timeouts and retries in the application.</p><p>- Inference costs increase significantly, even though the number of user requests stays roughly the same.</p><p>Due to compliance requirements, the team cannot log or store prompts or model responses. The team wants to understand whether:</p><p>- Latency issues are caused by model invocation delays or throttling</p><p>- Cost spikes are caused by increased input/output token usage</p><p>- Retries are contributing to both latency and cost increases</p><p>The team wants to use AWS-native monitoring with minimal operational overhead.</p><p>Which solution BEST meets these requirements?</p>","relatedLectureIds":["54419327"],"feedbacks":["","<p>Amazon Bedrock publishes native CloudWatch metrics including <code>InvocationLatency</code>, <code>InvocationThrottles</code>, error rates, and token counts (<code>InputTokenCount</code>, <code>OutputTokenCount</code>). These metrics enable cost and performance analysis without logging prompt content.CloudWatch Metrics track numerical performance/cost data, while CloudWatch Logs (via Model Invocation Logging) capture actual prompts and responses when needed.</p>","",""],"answers":["<p>Enable model invocation logging in Amazon Bedrock to capture request metadata and token counts, store logs in Amazon S3, and use Amazon Athena for cost and latency analysis.</p>","<p>Use Amazon CloudWatch metrics published by Amazon Bedrock to monitor invocation latency, throttling and error rates, and input/output token counts, and correlate these metrics with application-level retry metrics.</p>","<p>Stream inference request metadata to Amazon OpenSearch Service and build custom dashboards to track latency percentiles and token usage trends across peak traffic periods.</p>","<p>Use AWS X-Ray to trace inference requests end to end and analyze token-level execution time within the foundation model to identify latency bottlenecks.</p>"]},"correct_response":["b"],"updated":"2026-01-25T05:58:23Z","section":""}]};
        let answeredQuestions = new Set();

        function smartLinkify(text) {
            if (!text) return "";
            const regex = /((?:href|src)=["'])(https?:\/\/[^"']+)["']|(https?:\/\/[^\s<>"']+)/g;
            let processed = text.replace(regex, (match, prefix, quotedUrl, rawUrl) => {
                if (prefix) return match; 
                if (rawUrl) return '<a href="' + rawUrl + '" target="_blank">' + rawUrl + '</a>';
                return match;
            });
            return processed.replace(/\n/g, '<br>');
        }

        function init() {
            const container = document.getElementById('questions-container');
            quizData.questions.forEach((q, index) => {
                container.appendChild(createQuestionCard(q, index + 1));
            });
            setupImageZoom();
            updateStats(); // Init stats
        }

        // --- Stats Logic ---
        function updateStats() {
            const total = quizData.questions.length;
            let correct = 0;
            let wrong = 0;
            
            document.querySelectorAll('.question-card.answered').forEach(card => {
                // Check if user selected the correct option
                const hasWrong = card.querySelector('.option.user-wrong');
                if (hasWrong) {
                    wrong++;
                } else {
                    correct++;
                }
            });

            const answered = answeredQuestions.size;
            const remaining = total - answered;
            const score = answered > 0 ? Math.round((correct / total) * 100) : 0;

            document.getElementById('val-score').innerText = score + '%';
            document.getElementById('val-correct').innerText = correct;
            document.getElementById('val-wrong').innerText = wrong;
            document.getElementById('val-remain').innerText = remaining;
        }

        function createQuestionCard(qData, qNum) {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.dataset.id = qData.id;

            const prompt = qData.prompt || {};
            const answers = prompt.answers || [];
            const correctResponses = qData.correct_response || [];
            const feedbacks = qData.feedbacks || prompt.feedbacks || [];
            
            let overallExplanation = prompt.explanation || "";
            overallExplanation = smartLinkify(overallExplanation);

            const isMulti = correctResponses.length > 1;
            card.dataset.correct = JSON.stringify(correctResponses);
            card.dataset.isMulti = isMulti;

            let optionsHTML = '';
            answers.forEach((ans, idx) => {
                const letter = String.fromCharCode(97 + idx); 
                let ansText = typeof ans === 'string' ? ans : (ans.body || ans.content || '');
                let contentFeedback = feedbacks[idx] || "";
                contentFeedback = smartLinkify(contentFeedback);
                const feedbackHtml = contentFeedback ? '<div class="feedback-text">' + contentFeedback + '</div>' : '';

                optionsHTML += `
                    <li class="option" data-idx="${idx}" data-letter="${letter}" onclick="selectOption(this)">
                        <div class="option-content">
                            <span class="chk ${isMulti ? 'checkbox' : 'radio'}"></span>
                            <div style="flex:1">${ansText}</div>
                        </div>
                        ${feedbackHtml}
                    </li>`;
            });

            const qText = prompt.question || prompt.text || '';

            card.innerHTML = `
                <div class="q-header">Question ${qNum}</div>
                <div class="q-body">${qText}</div>
                <ul class="q-answers">${optionsHTML}</ul>
                <div class="btn-submit-container">
                    <button class="btn-submit" onclick="submitAnswer(this)">Answer</button>
                </div>
                <div class="overall-explanation">
                    <h4>Overall Explanation</h4>
                    <div>${overallExplanation}</div>
                </div>
            `;
            return card;
        }

        function selectOption(el) {
            const card = el.closest('.question-card');
            if (card.classList.contains('answered')) return;
            const isMulti = card.dataset.isMulti === 'true';
            if (isMulti) {
                el.classList.toggle('selected');
            } else {
                card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                el.classList.add('selected');
            }
        }

        function submitAnswer(btn) {
            const card = btn.closest('.question-card');
            if (card.classList.contains('answered')) return;

            const selectedOpts = card.querySelectorAll('.option.selected');
            if (selectedOpts.length === 0) return;

            card.classList.add('answered');
            answeredQuestions.add(card.dataset.id);
            const correctArr = JSON.parse(card.dataset.correct);
            btn.disabled = true;

            card.querySelectorAll('.option').forEach(opt => {
                const letter = opt.dataset.letter;
                const isCorrect = correctArr.includes(letter);
                const isSelected = opt.classList.contains('selected');
                
                if (isCorrect) {
                    opt.classList.add('show-correct'); 
                } else if (isSelected) {
                    opt.classList.add('user-wrong');
                }
            });

            const explanationDiv = card.querySelector('.overall-explanation div');
            if (explanationDiv && explanationDiv.innerHTML.trim() !== '') {
                card.querySelector('.overall-explanation').style.display = 'block';
            }
            setupImageZoom();
            updateStats(); // Update Score Board
        }

        function resetQuiz() {
            // [MODIFIED] Disabled confirmation dialog
            // if(!confirm('Reset all answers?')) return; 

            answeredQuestions.clear();
            document.querySelectorAll('.question-card').forEach(c => {
                c.classList.remove('answered');
                c.querySelectorAll('.option').forEach(o => {
                    o.classList.remove('selected', 'user-wrong', 'show-correct');
                });
                c.querySelector('.btn-submit').disabled = false;
                const exp = c.querySelector('.overall-explanation');
                if(exp) exp.style.display = 'none';
            });
            updateStats();
            window.scrollTo({top:0, behavior:'smooth'});
        }

        function setupImageZoom() {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("img01");
            document.querySelectorAll('img').forEach(img => {
                if(img.closest('#imageModal')) return;
                img.onclick = function() {
                    modal.style.display = "block";
                    modalImg.src = this.src;
                }
            });
        }
        function closeModal() { document.getElementById("imageModal").style.display = "none"; }
        window.onclick = function(e) { if (e.target == document.getElementById("imageModal")) closeModal(); }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedrock Foundations: Platform, Models, Guardrails & Inference</title>
    <style>
        /* --- Base Styles --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; padding: 30px; color: #333; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        
        h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; font-size: 1.8em; }
        
        /* --- Score Board Style --- */
        .score-board {
            display: flex; justify-content: space-around; background: white;
            padding: 15px; margin-bottom: 25px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e1e4e8;
        }
        .score-item { text-align: center; }
        .score-val { font-size: 1.5em; font-weight: bold; display: block; }
        .score-lbl { font-size: 0.85em; color: #7f8c8d; text-transform: uppercase; font-weight: 600; }
        
        .c-purple { color: #8e44ad; }
        .c-green { color: #27ae60; }
        .c-red { color: #e74c3c; }
        .c-grey { color: #7f8c8d; }

        .btn-reset-container { text-align: center; margin-bottom: 30px; }
        .btn-reset { 
            background-color: #34495e; color: white; border: none; padding: 8px 16px; 
            border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; 
            transition: 0.2s; 
        }
        .btn-reset:hover { background-color: #2c3e50; }

        /* --- Question Card --- */
        .question-card { 
            background: white; padding: 25px; margin-bottom: 25px; 
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid #e1e4e8; 
        }

        .q-header { font-weight: 700; color: #7f8c8d; margin-bottom: 15px; font-size: 0.9em; text-transform: uppercase; }
        .q-body { font-size: 1.2em; margin-bottom: 20px; color: #2c3e50; font-weight: 500; }
        
        /* Images */
        .question-card img, .feedback-text img, .overall-explanation img {
            max-width: 100% !important; height: auto !important; display: block;
            margin: 15px auto; border-radius: 6px; cursor: zoom-in;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .q-answers { list-style: none; padding: 0; }
        
        /* --- Option Styles --- */
        .option { 
            padding: 15px 20px; border: 2px solid #e1e4e8; margin-bottom: 12px; border-radius: 8px; 
            cursor: pointer; transition: all 0.2s ease; background: white; 
            display: flex; flex-direction: column;
        }
        
        .option-content { display: flex; align-items: flex-start; gap: 15px; width: 100%; }

        .option:hover:not(.answered) { border-color: #bdc3c7; background-color: #f8f9fa; }
        .option.selected:not(.answered) { border-color: #34495e; background-color: #edf2f7; }
        
        /* Icons */
        .chk { 
            font-size: 1.1em; flex-shrink: 0; width: 24px; height: 24px; 
            display: flex; align-items: center; justify-content: center; 
            border: 2px solid #bdc3c7; background: white; margin-top: 2px;
        }
        .chk.radio { border-radius: 50%; }
        .chk.checkbox { border-radius: 4px; }
        
        .option.selected .chk { border-color: #2c3e50; background: #2c3e50; }
        .option.selected .chk::after { content: ''; display: block; width: 10px; height: 10px; background: white; border-radius: 50%; }

        /* --- Feedback Section --- */
        .feedback-text {
            margin-top: 15px; padding: 12px 15px; font-size: 0.95em;
            border-left: 4px solid; background-color: rgba(255,255,255,0.5);
            border-radius: 0 4px 4px 0; animation: fadeIn 0.3s ease;
            display: none;
        }
        .feedback-text:empty { display: none !important; }

        /* --- Overall Explanation Section --- */
        .overall-explanation {
            display: none; margin-top: 25px; padding: 20px;
            background-color: #f0f7ff; border: 1px solid #cce5ff;
            border-radius: 8px; color: #333; animation: fadeIn 0.5s ease;
            overflow-wrap: break-word; 
        }
        .overall-explanation h4 {
            margin: 0 0 10px 0; color: #0056b3; font-size: 1em;
            text-transform: uppercase; font-weight: 700;
        }

        /* --- States After Submit --- */
        .option.user-wrong { border-color: #e74c3c; background-color: #fdecea; cursor: default; }
        .option.user-wrong .chk { border-color: #e74c3c; background: #e74c3c; }
        .option.user-wrong .chk::after { content: '✕'; color: white; background: none; font-size: 16px; font-weight: bold; width: auto; height: auto; }
        .option.user-wrong .feedback-text { display: block; border-color: #c0392b; color: #c0392b; background-color: rgba(231, 76, 60, 0.1); }

        .option.show-correct { border-color: #27ae60; background-color: #e8f8f5; cursor: default; }
        .option.show-correct .chk { border-color: #27ae60; background: #27ae60; }
        .option.show-correct .chk::after { content: '✓'; color: white; background: none; font-size: 16px; font-weight: bold; width: auto; height: auto; }
        .option.show-correct .feedback-text { display: block; border-color: #27ae60; color: #1e8449; background-color: rgba(39, 174, 96, 0.1); font-weight: 500; }

        .btn-submit-container { margin-top: 20px; }
        .btn-submit { background-color: #2980b9; color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; }
        .btn-submit:hover { background-color: #2471a3; }
        .btn-submit:disabled { opacity: 0.7; cursor: default; }

        /* Modal Zoom */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 90vh; }
        .close { position: absolute; top: 15px; right: 35px; color: #fff; font-size: 40px; cursor: pointer; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bedrock Foundations: Platform, Models, Guardrails & Inference</h1>
        
        <div class="score-board">
            <div class="score-item">
                <span class="score-val c-purple" id="val-score">0%</span>
                <span class="score-lbl">Score</span>
            </div>
            <div class="score-item">
                <span class="score-val c-green" id="val-correct">0</span>
                <span class="score-lbl">Correct</span>
            </div>
            <div class="score-item">
                <span class="score-val c-red" id="val-wrong">0</span>
                <span class="score-lbl">Wrong</span>
            </div>
            <div class="score-item">
                <span class="score-val c-grey" id="val-remain">0</span>
                <span class="score-lbl">Remaining</span>
            </div>
        </div>

        <div class="btn-reset-container">
            <button class="btn-reset" onclick="resetQuiz()">Reset Quiz</button>
        </div>
        <div id="questions-container"></div>
    </div>

    <div id="imageModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="img01">
    </div>

    <script>
        const quizData = {"quiz_title":"Bedrock Foundations: Platform, Models, Guardrails & Inference","questions":[{"_class":"assessment","id":144642371,"assessment_type":"multiple-choice","created":"2026-01-22T05:27:32Z","prompt":{"question":"<p>A company is building a generative AI–powered customer support feature for a mobile application. The application runs inside a customer VPC with <strong>no internet access</strong>.</p><p>The company wants to experiment with different foundation models over time. The solution must not require managing model infrastructure or scaling, and switching between foundation models should require minimal code changes. All traffic to the service must remain on the AWS network.</p><p>Which approach best meets these requirements?</p>","relatedLectureIds":["53860239"],"feedbacks":["","","<p>Amazon Bedrock is a <strong>fully managed, serverless service</strong> that abstracts model hosting and scaling. Applications invoke foundation models through a <strong>unified API</strong>, so switching models typically requires only changing configuration (such as the model ID), not application logic.</p><p>Amazon Bedrock supports <strong>VPC interface endpoints (AWS PrivateLink)</strong>, allowing private connectivity from a VPC without internet access while keeping traffic on the AWS network. </p>",""],"answers":["<p>Deploy foundation models on Amazon EC2 in private subnets and expose them through an internal Application Load Balancer.</p>","<p>Deploy foundation models on Amazon SageMaker endpoints in a VPC and update endpoint configurations when switching models.</p>","<p>Use Amazon Bedrock with a VPC interface endpoint, invoking models through the Bedrock API and changing only the model identifier when switching models.</p>","<p>Fine-tune a single foundation model and expose it through an Amazon API Gateway private endpoint.</p>"]},"correct_response":["c"],"updated":"2026-01-25T04:27:53Z","section":""},{"_class":"assessment","id":144703935,"assessment_type":"multiple-choice","created":"2026-01-22T09:34:02Z","prompt":{"question":"<p>A manufacturing company wants to build a generative AI application that analyzes equipment logs and generates detailed diagnostic reports. The company plans to use an open-source large language model but must adapt the model to its proprietary terminology and historical maintenance data.</p><p>The application has the following requirements. The company needs full control over model customization and training. Inference latency and throughput must be predictable and tunable because the application will be used during live operational incidents. The model must be deployed within the company’s VPC.</p><p>Which solution best meets these requirements?</p>","relatedLectureIds":["53749735"],"feedbacks":["","<p>SageMaker JumpStart lets you fine‑tune and deploy models inside your VPC, giving full control over scaling, latency, security, and domain adaptation. It suits performance‑sensitive workloads needing customization. Amazon Bedrock offers managed, pre‑trained models with private access (over Private Link) but cannot be deployed within customer VPC. Other options may boost performance but cannot customize models or support VPC‑level deployment.&nbsp; </p>","",""],"answers":["<p>Use Amazon Bedrock to invoke a base foundation model and rely on prompt engineering to adapt responses to the manufacturing domain.</p>","<p>Use Amazon SageMaker JumpStart to fine-tune an open-source foundation model and deploy it on a managed inference endpoint with configurable instance types, auto scaling and within company VPC.</p>","<p>Use Amazon Bedrock with cross-Region inference enabled to improve throughput and availability.</p>","<p>Use Amazon Bedrock provisioned throughput to guarantee performance and customize the model using inference parameters.</p>"]},"correct_response":["b"],"updated":"2026-01-25T04:27:53Z","section":""},{"_class":"assessment","id":144704753,"assessment_type":"multiple-choice","created":"2026-01-22T09:36:54Z","prompt":{"question":"<p>A legal services company is building a generative AI application to summarize long contracts and answer detailed questions about them. Individual documents can exceed 50+ pages, and users expect accurate, well-reasoned, and complete responses. The application is used by internal analysts, so sub-second latency is not required, but costs must remain predictable.</p><p>The team also wants to control the <strong>length and determinism</strong> of model outputs to ensure summaries are comprehensive and consistent across repeated queries.</p><p>Which foundation model selection and inference configuration BEST meets these requirements?</p>","relatedLectureIds":["53749741"],"feedbacks":["","<p>Summarizing legal documents requires a model with strong reasoning capabilities and a large context window, since documents are long and often require cross-section analysis. Larger language models are better suited for this use case. To ensure consistent and deterministic outputs, a low temperature should be used, along with a sufficiently high maxTokens value to avoid truncated responses. Smaller or latency-optimized models lack the reasoning depth needed, and embeddings models cannot generate summaries.</p>","",""],"answers":["<p>Choose the smallest language model available and set a low maxTokens value to reduce cost and improve latency.</p>","<p>Choose a large language model with a long context window and strong reasoning capabilities, and configure inference parameters with a sufficiently high <code>maxTokens</code> value and low temperature.</p>","<p>Choose a latency-optimized model, split documents into small chunks, and increase temperature to encourage diverse responses.</p>","<p>Choose an embeddings model and rely on vector similarity search, using inference parameters to control output length.</p>"]},"correct_response":["b"],"updated":"2026-01-25T04:27:53Z","section":""},{"_class":"assessment","id":144704787,"assessment_type":"multiple-choice","created":"2026-01-22T09:38:49Z","prompt":{"question":"<p>A financial services company is building a generative AI assistant to answer internal analyst questions about regulatory policies and compliance procedures. Incorrect, non-compliant, or fabricated responses could lead to regulatory violations.</p><p>The company has the following requirements. Responses must be grounded in approved internal policy documents to reduce hallucinations. Generated answers must be validated against domain-specific logical rules, such as eligibility criteria and compliance constraints. The company also wants to strictly block high-risk or non-compliant content while allowing neutral explanatory responses to pass through. The solution must be implemented without retraining or modifying the foundation model.</p><p>Which solution BEST meets these requirements?</p>","relatedLectureIds":["53749743"],"feedbacks":["","<p>This solution uses multiple Bedrock Guardrails features. Grounding checks ensure answers rely only on approved documents, reducing hallucinations. High‑strength filters block harmful content while allowing safe compliance discussion. Automated Reasoning enforces domain rules without retraining. Other options fail: default filters lack grounding, weak settings can’t ensure compliance, and fine‑tuning violates the requirement not to modify the model.</p>","",""],"answers":["<p>Configure Amazon Bedrock Guardrails with default content filters, denied topics for regulatory terms, and reduce the model temperature to improve response consistency.</p>","<p>Configure Amazon Bedrock Guardrails with high-strength content filters, enable contextual grounding checks against approved policy documents, and apply Automated Reasoning checks to validate responses against formal compliance logic and policy constraints.</p>","<p>Use Amazon Bedrock Guardrails with low-strength content filters and rely on detailed system prompts that reference approved policy documents, combined with low temperature settings to reduce hallucinations and unsafe outputs.</p>","<p>Use Amazon Bedrock Guardrails with low-strength content filters for content filtering and grounding, and fine-tune the foundation model on historical compliance documents to reduce the likelihood of non-compliant responses.</p>"]},"correct_response":["b"],"updated":"2026-01-25T04:27:53Z","section":""},{"_class":"assessment","id":144711621,"assessment_type":"multiple-choice","created":"2026-01-22T09:52:59Z","prompt":{"question":"<p>A company is building a customer-facing generative AI assistant to answer questions about <strong>internal product documentation and usage guidelines</strong>.</p><p>During development, the team identifies two challenges. First, the <strong>accuracy and reasoning quality</strong> of responses must be improved with minimal implementation effort. Second, during testing, users are able to elicit <strong>restricted or policy-violating content</strong> by rephrasing questions or embedding indirect instructions, even when prompts are carefully designed.</p><p>The company wants a solution that improves answer accuracy through prompting, while also <strong>consistently enforcing safety and usage policies</strong>, without retraining or modifying the foundation model.</p><p>Which solution BEST meets these requirements?</p>","relatedLectureIds":["53749749"],"feedbacks":["","","<p>Few‑shot prompting improves accuracy and structure but is probabilistic and can be bypassed. Bedrock Guardrails provide deterministic policy enforcement by blocking restricted content regardless of phrasing.&nbsp; Other options rely only on prompt tweaks or inference settings, which AWS does not recommend for enforcing restricted content in production.</p>",""],"answers":["<p>Expand the system prompt with additional few-shot examples that demonstrate correct reasoning and explicitly show safe responses for restricted scenarios.</p>","<p>Use few-shot prompting to improve reasoning accuracy and reduce inference randomness by lowering temperature and top-p values.</p>","<p>Use few-shot prompting to improve answer accuracy and enable Amazon Bedrock Guardrails with appropriate content filters to deterministically block restricted responses.</p>","<p>Increase the model context window to include more policy documentation so the model can reason about allowed and disallowed content.</p>"]},"correct_response":["c"],"updated":"2026-01-25T04:27:53Z","section":""},{"_class":"assessment","id":144713039,"assessment_type":"multiple-choice","created":"2026-01-22T09:56:49Z","prompt":{"question":"<p>A generative AI application hosted in a single AWS Region uses Amazon Bedrock to generate product descriptions in real time. During flash sales, the application exhibits the following behavior:</p><p>- Requests intermittently fail due to throttling</p><p>- Latency increases significantly during traffic spikes</p><p>- The application team wants to avoid implementing custom routing logic, managing multi-region failover, or switching foundation models</p><p>The company wants a <strong>managed AWS solution</strong> that improves both <strong>throughput and latency</strong> during peak demand, without introducing additional operational overhead.</p><p>Which solution BEST meets these requirements?</p>","relatedLectureIds":["54364811"],"feedbacks":["","","","<p>Cross‑Region inference increases throughput by spreading traffic across Regions and uses latency‑aware routing to pick Regions with capacity and lower delay—all fully managed, with no application changes. Other choices fall short: inference tuning doesn’t fix throttling, provisioned throughput needs planning and doesn’t help sudden spikes, and prompt caching reduces cost but not throttling.</p>"],"answers":["<p>Reduce output token limits and lower temperature values to decrease per-request inference time and reduce overall latency under load.</p>","<p>Use prompt caching to reuse static prompt prefixes and reduce input token processing time during high traffic periods.</p>","<p>Enable Provisioned Throughput for the foundation model to reserve dedicated capacity and eliminate throttling during peak traffic events.</p>","<p>Enable cross-region inference and configure latency-optimized routing so Amazon Bedrock automatically routes requests to regions with available capacity and lower response times.</p>"]},"correct_response":["d"],"updated":"2026-01-25T04:34:54Z","section":""},{"_class":"assessment","id":144713185,"assessment_type":"multiple-choice","created":"2026-01-22T09:58:20Z","prompt":{"question":"<p>A company runs a mission-critical generative AI application on Amazon Bedrock. The application has sustained high traffic, strict availability requirements, and cannot tolerate throttling or unpredictable latency during peak hours.</p><p>Each request includes a large, mostly static system prompt that is reused across requests, but the team observes that prompt caching does not materially reduce cost due to the prompt's size relative to the varying output. The company is willing to commit to capacity in advance to ensure consistent performance.</p><p>Which solution BEST meets these requirements?</p>","relatedLectureIds":["54211595"],"feedbacks":["","","<p>Provisioned Throughput in Amazon Bedrock allows customers to purchase dedicated inference capacity for a specific foundation model, providing guaranteed throughput with no throttling, predictable latency, and high availability. On-demand with caching and cross-region inference still use shared capacity that can be throttled during peak demand. Batch inference is designed for asynchronous, non-time-sensitive workloads and is unsuitable for mission-critical real-time applications.</p>",""],"answers":["<p>Use on-demand inference and rely on prompt caching to reduce repeated input processing and reduce variable latency during peak hours.</p>","<p>Enable cross-region inference with latency-optimized routing to distribute traffic across multiple AWS Regions and reduce the likelihood of throttling.</p>","<p>Purchase Provisioned Throughput to reserve dedicated inference capacity, ensuring guaranteed availability and predictable latency for the application.</p>","<p>Use Batch inference to process requests asynchronously and take advantage of lower-cost capacity during off-peak hours.</p>"]},"correct_response":["c"],"updated":"2026-01-25T04:48:48Z","section":""}]};
        let answeredQuestions = new Set();

        function smartLinkify(text) {
            if (!text) return "";
            const regex = /((?:href|src)=["'])(https?:\/\/[^"']+)["']|(https?:\/\/[^\s<>"']+)/g;
            let processed = text.replace(regex, (match, prefix, quotedUrl, rawUrl) => {
                if (prefix) return match; 
                if (rawUrl) return '<a href="' + rawUrl + '" target="_blank">' + rawUrl + '</a>';
                return match;
            });
            return processed.replace(/\n/g, '<br>');
        }

        function init() {
            const container = document.getElementById('questions-container');
            quizData.questions.forEach((q, index) => {
                container.appendChild(createQuestionCard(q, index + 1));
            });
            setupImageZoom();
            updateStats(); // Init stats
        }

        // --- Stats Logic ---
        function updateStats() {
            const total = quizData.questions.length;
            let correct = 0;
            let wrong = 0;
            
            document.querySelectorAll('.question-card.answered').forEach(card => {
                // Check if user selected the correct option
                const hasWrong = card.querySelector('.option.user-wrong');
                if (hasWrong) {
                    wrong++;
                } else {
                    correct++;
                }
            });

            const answered = answeredQuestions.size;
            const remaining = total - answered;
            const score = answered > 0 ? Math.round((correct / total) * 100) : 0;

            document.getElementById('val-score').innerText = score + '%';
            document.getElementById('val-correct').innerText = correct;
            document.getElementById('val-wrong').innerText = wrong;
            document.getElementById('val-remain').innerText = remaining;
        }

        function createQuestionCard(qData, qNum) {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.dataset.id = qData.id;

            const prompt = qData.prompt || {};
            const answers = prompt.answers || [];
            const correctResponses = qData.correct_response || [];
            const feedbacks = qData.feedbacks || prompt.feedbacks || [];
            
            let overallExplanation = prompt.explanation || "";
            overallExplanation = smartLinkify(overallExplanation);

            const isMulti = correctResponses.length > 1;
            card.dataset.correct = JSON.stringify(correctResponses);
            card.dataset.isMulti = isMulti;

            let optionsHTML = '';
            answers.forEach((ans, idx) => {
                const letter = String.fromCharCode(97 + idx); 
                let ansText = typeof ans === 'string' ? ans : (ans.body || ans.content || '');
                let contentFeedback = feedbacks[idx] || "";
                contentFeedback = smartLinkify(contentFeedback);
                const feedbackHtml = contentFeedback ? '<div class="feedback-text">' + contentFeedback + '</div>' : '';

                optionsHTML += `
                    <li class="option" data-idx="${idx}" data-letter="${letter}" onclick="selectOption(this)">
                        <div class="option-content">
                            <span class="chk ${isMulti ? 'checkbox' : 'radio'}"></span>
                            <div style="flex:1">${ansText}</div>
                        </div>
                        ${feedbackHtml}
                    </li>`;
            });

            const qText = prompt.question || prompt.text || '';

            card.innerHTML = `
                <div class="q-header">Question ${qNum}</div>
                <div class="q-body">${qText}</div>
                <ul class="q-answers">${optionsHTML}</ul>
                <div class="btn-submit-container">
                    <button class="btn-submit" onclick="submitAnswer(this)">Answer</button>
                </div>
                <div class="overall-explanation">
                    <h4>Overall Explanation</h4>
                    <div>${overallExplanation}</div>
                </div>
            `;
            return card;
        }

        function selectOption(el) {
            const card = el.closest('.question-card');
            if (card.classList.contains('answered')) return;
            const isMulti = card.dataset.isMulti === 'true';
            if (isMulti) {
                el.classList.toggle('selected');
            } else {
                card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                el.classList.add('selected');
            }
        }

        function submitAnswer(btn) {
            const card = btn.closest('.question-card');
            if (card.classList.contains('answered')) return;

            const selectedOpts = card.querySelectorAll('.option.selected');
            if (selectedOpts.length === 0) return;

            card.classList.add('answered');
            answeredQuestions.add(card.dataset.id);
            const correctArr = JSON.parse(card.dataset.correct);
            btn.disabled = true;

            card.querySelectorAll('.option').forEach(opt => {
                const letter = opt.dataset.letter;
                const isCorrect = correctArr.includes(letter);
                const isSelected = opt.classList.contains('selected');
                
                if (isCorrect) {
                    opt.classList.add('show-correct'); 
                } else if (isSelected) {
                    opt.classList.add('user-wrong');
                }
            });

            const explanationDiv = card.querySelector('.overall-explanation div');
            if (explanationDiv && explanationDiv.innerHTML.trim() !== '') {
                card.querySelector('.overall-explanation').style.display = 'block';
            }
            setupImageZoom();
            updateStats(); // Update Score Board
        }

        function resetQuiz() {
            // [MODIFIED] Disabled confirmation dialog
            // if(!confirm('Reset all answers?')) return; 

            answeredQuestions.clear();
            document.querySelectorAll('.question-card').forEach(c => {
                c.classList.remove('answered');
                c.querySelectorAll('.option').forEach(o => {
                    o.classList.remove('selected', 'user-wrong', 'show-correct');
                });
                c.querySelector('.btn-submit').disabled = false;
                const exp = c.querySelector('.overall-explanation');
                if(exp) exp.style.display = 'none';
            });
            updateStats();
            window.scrollTo({top:0, behavior:'smooth'});
        }

        function setupImageZoom() {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("img01");
            document.querySelectorAll('img').forEach(img => {
                if(img.closest('#imageModal')) return;
                img.onclick = function() {
                    modal.style.display = "block";
                    modalImg.src = this.src;
                }
            });
        }
        function closeModal() { document.getElementById("imageModal").style.display = "none"; }
        window.onclick = function(e) { if (e.target == document.getElementById("imageModal")) closeModal(); }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

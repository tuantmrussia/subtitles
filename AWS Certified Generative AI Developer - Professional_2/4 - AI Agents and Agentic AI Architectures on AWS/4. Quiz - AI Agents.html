<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - AI Agents</title>
    <style>
        /* --- Base Styles --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; padding: 30px; color: #333; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        
        h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; font-size: 1.8em; }
        
        /* --- Score Board Style --- */
        .score-board {
            display: flex; justify-content: space-around; background: white;
            padding: 15px; margin-bottom: 25px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e1e4e8;
        }
        .score-item { text-align: center; }
        .score-val { font-size: 1.5em; font-weight: bold; display: block; }
        .score-lbl { font-size: 0.85em; color: #7f8c8d; text-transform: uppercase; font-weight: 600; }
        
        .c-purple { color: #8e44ad; }
        .c-green { color: #27ae60; }
        .c-red { color: #e74c3c; }
        .c-grey { color: #7f8c8d; }

        .btn-reset-container { text-align: center; margin-bottom: 30px; }
        .btn-reset { 
            background-color: #34495e; color: white; border: none; padding: 8px 16px; 
            border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; 
            transition: 0.2s; 
        }
        .btn-reset:hover { background-color: #2c3e50; }

        /* --- Question Card --- */
        .question-card { 
            background: white; padding: 25px; margin-bottom: 25px; 
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid #e1e4e8; 
        }

        .q-header { font-weight: 700; color: #7f8c8d; margin-bottom: 15px; font-size: 0.9em; text-transform: uppercase; }
        .q-body { font-size: 1.2em; margin-bottom: 20px; color: #2c3e50; font-weight: 500; }
        
        /* Images */
        .question-card img, .feedback-text img, .overall-explanation img {
            max-width: 100% !important; height: auto !important; display: block;
            margin: 15px auto; border-radius: 6px; cursor: zoom-in;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .q-answers { list-style: none; padding: 0; }
        
        /* --- Option Styles --- */
        .option { 
            padding: 15px 20px; border: 2px solid #e1e4e8; margin-bottom: 12px; border-radius: 8px; 
            cursor: pointer; transition: all 0.2s ease; background: white; 
            display: flex; flex-direction: column;
        }
        
        .option-content { display: flex; align-items: flex-start; gap: 15px; width: 100%; }

        .option:hover:not(.answered) { border-color: #bdc3c7; background-color: #f8f9fa; }
        .option.selected:not(.answered) { border-color: #34495e; background-color: #edf2f7; }
        
        /* Icons */
        .chk { 
            font-size: 1.1em; flex-shrink: 0; width: 24px; height: 24px; 
            display: flex; align-items: center; justify-content: center; 
            border: 2px solid #bdc3c7; background: white; margin-top: 2px;
        }
        .chk.radio { border-radius: 50%; }
        .chk.checkbox { border-radius: 4px; }
        
        .option.selected .chk { border-color: #2c3e50; background: #2c3e50; }
        .option.selected .chk::after { content: ''; display: block; width: 10px; height: 10px; background: white; border-radius: 50%; }

        /* --- Feedback Section --- */
        .feedback-text {
            margin-top: 15px; padding: 12px 15px; font-size: 0.95em;
            border-left: 4px solid; background-color: rgba(255,255,255,0.5);
            border-radius: 0 4px 4px 0; animation: fadeIn 0.3s ease;
            display: none;
        }
        .feedback-text:empty { display: none !important; }

        /* --- Overall Explanation Section --- */
        .overall-explanation {
            display: none; margin-top: 25px; padding: 20px;
            background-color: #f0f7ff; border: 1px solid #cce5ff;
            border-radius: 8px; color: #333; animation: fadeIn 0.5s ease;
            overflow-wrap: break-word; 
        }
        .overall-explanation h4 {
            margin: 0 0 10px 0; color: #0056b3; font-size: 1em;
            text-transform: uppercase; font-weight: 700;
        }

        /* --- States After Submit --- */
        .option.user-wrong { border-color: #e74c3c; background-color: #fdecea; cursor: default; }
        .option.user-wrong .chk { border-color: #e74c3c; background: #e74c3c; }
        .option.user-wrong .chk::after { content: '✕'; color: white; background: none; font-size: 16px; font-weight: bold; width: auto; height: auto; }
        .option.user-wrong .feedback-text { display: block; border-color: #c0392b; color: #c0392b; background-color: rgba(231, 76, 60, 0.1); }

        .option.show-correct { border-color: #27ae60; background-color: #e8f8f5; cursor: default; }
        .option.show-correct .chk { border-color: #27ae60; background: #27ae60; }
        .option.show-correct .chk::after { content: '✓'; color: white; background: none; font-size: 16px; font-weight: bold; width: auto; height: auto; }
        .option.show-correct .feedback-text { display: block; border-color: #27ae60; color: #1e8449; background-color: rgba(39, 174, 96, 0.1); font-weight: 500; }

        .btn-submit-container { margin-top: 20px; }
        .btn-submit { background-color: #2980b9; color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; }
        .btn-submit:hover { background-color: #2471a3; }
        .btn-submit:disabled { opacity: 0.7; cursor: default; }

        /* Modal Zoom */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 90vh; }
        .close { position: absolute; top: 15px; right: 35px; color: #fff; font-size: 40px; cursor: pointer; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quiz - AI Agents</h1>
        
        <div class="score-board">
            <div class="score-item">
                <span class="score-val c-purple" id="val-score">0%</span>
                <span class="score-lbl">Score</span>
            </div>
            <div class="score-item">
                <span class="score-val c-green" id="val-correct">0</span>
                <span class="score-lbl">Correct</span>
            </div>
            <div class="score-item">
                <span class="score-val c-red" id="val-wrong">0</span>
                <span class="score-lbl">Wrong</span>
            </div>
            <div class="score-item">
                <span class="score-val c-grey" id="val-remain">0</span>
                <span class="score-lbl">Remaining</span>
            </div>
        </div>

        <div class="btn-reset-container">
            <button class="btn-reset" onclick="resetQuiz()">Reset Quiz</button>
        </div>
        <div id="questions-container"></div>
    </div>

    <div id="imageModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="img01">
    </div>

    <script>
        const quizData = {"quiz_title":"Quiz - AI Agents","questions":[{"_class":"assessment","id":144927809,"assessment_type":"multiple-choice","created":"2026-01-23T13:05:03Z","prompt":{"question":"<p>A financial services company is building an Agentic AI application to automate secure account operations. The agent must retrieve transaction history from a PostgreSQL-backed service, execute fund transfers through a secure banking API only after fraud checks pass, prevent account numbers from appearing in agent reasoning traces or responses.</p><p>Which combination of Amazon Bedrock Agent components BEST meets these requirements?</p>","relatedLectureIds":["53840845"],"feedbacks":["","","<p>The Lambda function within Action Groups can implement conditional logic to ensure fund transfers only execute after fraud checks pass. Guardrails with PII redaction ensure sensitive account data is never exposed in agent traces or responses. Knowledge Bases donot support direct querying the PostgreSQL database and needs to be done via Bedrock Agent&nbsp;Action group</p>",""],"answers":["<p>Knowledge Bases for querying the PostgreSQL database, Guardrails for masking sensitive data, and Bedrock Agent framework for workflow orchestration</p>","<p>Model fine-tuning to learn API schemas, Knowledge Bases for transaction retrieval, and Guardrails for data masking</p>","<p>Action Groups backed by AWS Lambda for database and API access and Guardrails with PII redaction policies</p>","<p>Bedrock Agents for sequential processing, Action Groups for API calls, and model fine-tuning for error-handling behavior</p>"]},"correct_response":["c"],"updated":"2026-01-25T06:52:53Z","section":""},{"_class":"assessment","id":144927817,"assessment_type":"multiple-choice","created":"2026-01-23T13:06:10Z","prompt":{"question":"<p>A healthcare company is building a diagnostic support system that must search peer-reviewed medical journals, retrieve patient history using FHIR APIs, check drug interaction databases, and interpret physician queries by combining all retrieved results into a single response. The system must support parallel task execution for faster responses, handle partial failures without breaking the entire workflow, maintain full reasoning traces for regulatory audits, and scale to 500 concurrent requests.</p><p>Which architecture should the developer implement?</p>","relatedLectureIds":["54499377"],"feedbacks":["","<p>A multi-agent architecture allows specialized agents to execute independent tasks <strong>in parallel</strong>, such patient data retrieval via FHIR APIs, and drug interaction checks, while a supervisor agent aggregates results into a unified response. This design supports high concurrency <strong>(500 requests distributed across sub-agents)</strong>, isolates partial failures <strong>(one agent failing returns partial results without breaking the workflow)</strong>. Single-agent architectures with multiple Action Groups process tasks sequentially and lack fault isolation.</p>","",""],"answers":["<p>A single Amazon Bedrock Agent with a Knowledge Base for medical literature and separate Action Groups for patient history and drug interaction checks, processing tasks sequentially</p>","<p>A multi-agent architecture with a supervisor agent coordinating specialized sub-agents, each with dedicated Knowledge Bases or Action Groups</p>","<p>A single Amazon Bedrock Agent with multiple Knowledge Bases for all data sources (journals, patient records, drug interactions) and Guardrails for compliance</p>","<p>A single Amazon Bedrock Agent with one Knowledge Base containing indexed medical literature and patient records, and one Action Group handling all external API calls</p>"]},"correct_response":["b"],"updated":"2026-01-25T07:02:37Z","section":""},{"_class":"assessment","id":144927841,"assessment_type":"multiple-choice","created":"2026-01-23T13:10:41Z","prompt":{"question":"<p>A company is building a real-time&nbsp; agentic AI fraud detection system using AI agents. The solution must process transactions with low latency, support automatic scaling during peak usage, execute custom fraud detection logic, and work with models from any provider rather than being limited to Amazon Bedrock models. It should also be Agentic AI framework agnostic.</p><p>Which approach best meets these requirements?</p>","relatedLectureIds":["54316031"],"feedbacks":["<p>Amazon Bedrock AgentCore provides a managed runtime for deploying AI agents built with any framework (LangChain, LangGraph, CrewAI, custom) and any model provider (not limited to Bedrock). It offers built-in auto-scaling, low-latency execution, and supports custom business logic—making it ideal for framework-agnostic, model-agnostic agent deployments. Bedrock Agents and the InvokeAgent API are tied to Bedrock models and the Bedrock Agents framework. SageMaker provides model hosting but lacks support for various open-source Agentic AI frameworks</p>","","",""],"answers":["<p>Use Amazon Bedrock AgentCore with a managed runtime, leveraging its model-agnostic design, built-in auto-scaling, and low-latency execution.</p>","<p>Deploy agents using Amazon Bedrock Agents with Lambda-based Action Groups, provisioned concurrency, and cross-region inference for model flexibility.</p>","<p>Deploy agents on Amazon ECS with Fargate using the Bedrock InvokeAgent API</p>","<p>Use Amazon SageMaker real-time endpoints with auto-scaling policies and Step Functions for workflow orchestration.</p>"]},"correct_response":["a"],"updated":"2026-01-25T07:12:26Z","section":""},{"_class":"assessment","id":144927893,"assessment_type":"multiple-choice","created":"2026-01-23T13:12:19Z","prompt":{"question":"<p>A solutions architect is explaining MCP to their team. Which statement accurately describes the MCP architecture?</p>","relatedLectureIds":["53749805"],"feedbacks":["","<p>MCP is an open protocol using client-server architecture. Servers expose tools, resources, and prompts; clients discover and invoke them via JSON-RPC over stdio or HTTP.</p>","",""],"answers":["<p>MCP is an AWS-proprietary protocol that only works with Amazon Bedrock models</p>","<p>MCP uses a client-server architecture where MCP servers expose tools/resources and MCP clients (AI applications) discover and invoke them through a standardized JSON-RPC protocol</p>","<p>MCP requires all tools to be hosted on AWS Lambda with specific IAM permissions</p>","<p>MCP is a replacement for REST APIs designed exclusively for synchronous request-response patterns</p>"]},"correct_response":["b"],"updated":"2026-01-25T07:14:39Z","section":""},{"_class":"assessment","id":144928083,"assessment_type":"multiple-choice","created":"2026-01-23T13:14:56Z","prompt":{"question":"<p>A large retail company is building an AI-powered customer support assistant that must handle order status inquiries, process returns, and provide personalized product recommendations. Each capability relies on different data sources and specialized business logic. The architecture team has the following requirements:</p><p>- Intelligently route user requests to the best-suited agent based on intent</p><p>- Support multiple agent types: Amazon Bedrock Agents, Amazon Lex bots, and Lambda functions</p><p>- Maintain unified conversation context across all interactions</p><p>- Use an open-source solution for flexibility and customization</p><p>Which approach <strong>BEST</strong> meets these requirements?</p>","relatedLectureIds":"","feedbacks":["","<p>Agent Squad is an open-source framework released by AWS that provides LLM-based intent classification, support for heterogeneous agent types (Bedrock Agents, Lex bots, Lambda functions, and custom agents), and built-in conversation context management. Bedrock Agents framework is not open-source framework. CrewAI and LangGraph are valid open-source orchestration frameworks, they don't provide native integration with Amazon Lex bots etc.</p>","",""],"answers":["<p>Build a single Bedrock Agent with multiple Action Groups for orders, returns, and recommendations, using Lambda for custom logic</p>","<p>Use the open-source Agent Squad framework with LLM-based intent classification to route queries to specialized agents (Bedrock, Lex, Lambda) with shared conversation context</p>","<p>Create multi-agent solution using open source frameworks such as CrewAI or Lang Graph which redirect the request to relevant agent based on customers request intent</p>","<p>Use Amazon API Gateway to route requests based on keyword matching to different backend services.</p>"]},"correct_response":["b"],"updated":"2026-01-25T07:26:47Z","section":""}]};
        let answeredQuestions = new Set();

        function smartLinkify(text) {
            if (!text) return "";
            const regex = /((?:href|src)=["'])(https?:\/\/[^"']+)["']|(https?:\/\/[^\s<>"']+)/g;
            let processed = text.replace(regex, (match, prefix, quotedUrl, rawUrl) => {
                if (prefix) return match; 
                if (rawUrl) return '<a href="' + rawUrl + '" target="_blank">' + rawUrl + '</a>';
                return match;
            });
            return processed.replace(/\n/g, '<br>');
        }

        function init() {
            const container = document.getElementById('questions-container');
            quizData.questions.forEach((q, index) => {
                container.appendChild(createQuestionCard(q, index + 1));
            });
            setupImageZoom();
            updateStats(); // Init stats
        }

        // --- Stats Logic ---
        function updateStats() {
            const total = quizData.questions.length;
            let correct = 0;
            let wrong = 0;
            
            document.querySelectorAll('.question-card.answered').forEach(card => {
                // Check if user selected the correct option
                const hasWrong = card.querySelector('.option.user-wrong');
                if (hasWrong) {
                    wrong++;
                } else {
                    correct++;
                }
            });

            const answered = answeredQuestions.size;
            const remaining = total - answered;
            const score = answered > 0 ? Math.round((correct / total) * 100) : 0;

            document.getElementById('val-score').innerText = score + '%';
            document.getElementById('val-correct').innerText = correct;
            document.getElementById('val-wrong').innerText = wrong;
            document.getElementById('val-remain').innerText = remaining;
        }

        function createQuestionCard(qData, qNum) {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.dataset.id = qData.id;

            const prompt = qData.prompt || {};
            const answers = prompt.answers || [];
            const correctResponses = qData.correct_response || [];
            const feedbacks = qData.feedbacks || prompt.feedbacks || [];
            
            let overallExplanation = prompt.explanation || "";
            overallExplanation = smartLinkify(overallExplanation);

            const isMulti = correctResponses.length > 1;
            card.dataset.correct = JSON.stringify(correctResponses);
            card.dataset.isMulti = isMulti;

            let optionsHTML = '';
            answers.forEach((ans, idx) => {
                const letter = String.fromCharCode(97 + idx); 
                let ansText = typeof ans === 'string' ? ans : (ans.body || ans.content || '');
                let contentFeedback = feedbacks[idx] || "";
                contentFeedback = smartLinkify(contentFeedback);
                const feedbackHtml = contentFeedback ? '<div class="feedback-text">' + contentFeedback + '</div>' : '';

                optionsHTML += `
                    <li class="option" data-idx="${idx}" data-letter="${letter}" onclick="selectOption(this)">
                        <div class="option-content">
                            <span class="chk ${isMulti ? 'checkbox' : 'radio'}"></span>
                            <div style="flex:1">${ansText}</div>
                        </div>
                        ${feedbackHtml}
                    </li>`;
            });

            const qText = prompt.question || prompt.text || '';

            card.innerHTML = `
                <div class="q-header">Question ${qNum}</div>
                <div class="q-body">${qText}</div>
                <ul class="q-answers">${optionsHTML}</ul>
                <div class="btn-submit-container">
                    <button class="btn-submit" onclick="submitAnswer(this)">Answer</button>
                </div>
                <div class="overall-explanation">
                    <h4>Overall Explanation</h4>
                    <div>${overallExplanation}</div>
                </div>
            `;
            return card;
        }

        function selectOption(el) {
            const card = el.closest('.question-card');
            if (card.classList.contains('answered')) return;
            const isMulti = card.dataset.isMulti === 'true';
            if (isMulti) {
                el.classList.toggle('selected');
            } else {
                card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                el.classList.add('selected');
            }
        }

        function submitAnswer(btn) {
            const card = btn.closest('.question-card');
            if (card.classList.contains('answered')) return;

            const selectedOpts = card.querySelectorAll('.option.selected');
            if (selectedOpts.length === 0) return;

            card.classList.add('answered');
            answeredQuestions.add(card.dataset.id);
            const correctArr = JSON.parse(card.dataset.correct);
            btn.disabled = true;

            card.querySelectorAll('.option').forEach(opt => {
                const letter = opt.dataset.letter;
                const isCorrect = correctArr.includes(letter);
                const isSelected = opt.classList.contains('selected');
                
                if (isCorrect) {
                    opt.classList.add('show-correct'); 
                } else if (isSelected) {
                    opt.classList.add('user-wrong');
                }
            });

            const explanationDiv = card.querySelector('.overall-explanation div');
            if (explanationDiv && explanationDiv.innerHTML.trim() !== '') {
                card.querySelector('.overall-explanation').style.display = 'block';
            }
            setupImageZoom();
            updateStats(); // Update Score Board
        }

        function resetQuiz() {
            // [MODIFIED] Disabled confirmation dialog
            // if(!confirm('Reset all answers?')) return; 

            answeredQuestions.clear();
            document.querySelectorAll('.question-card').forEach(c => {
                c.classList.remove('answered');
                c.querySelectorAll('.option').forEach(o => {
                    o.classList.remove('selected', 'user-wrong', 'show-correct');
                });
                c.querySelector('.btn-submit').disabled = false;
                const exp = c.querySelector('.overall-explanation');
                if(exp) exp.style.display = 'none';
            });
            updateStats();
            window.scrollTo({top:0, behavior:'smooth'});
        }

        function setupImageZoom() {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("img01");
            document.querySelectorAll('img').forEach(img => {
                if(img.closest('#imageModal')) return;
                img.onclick = function() {
                    modal.style.display = "block";
                    modalImg.src = this.src;
                }
            });
        }
        function closeModal() { document.getElementById("imageModal").style.display = "none"; }
        window.onclick = function(e) { if (e.target == document.getElementById("imageModal")) closeModal(); }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

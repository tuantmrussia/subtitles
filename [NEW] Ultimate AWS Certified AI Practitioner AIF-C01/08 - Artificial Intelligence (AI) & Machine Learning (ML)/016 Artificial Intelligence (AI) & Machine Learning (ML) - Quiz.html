<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto,
          segoe ui, Helvetica, Arial, sans-serif, apple color emoji,
          segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      code {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .quiz-content {
        padding: 2.4rem;
        word-break: break-word;
        max-width: 86rem;
        margin: 0 auto;
      }
      .quiz-container {
        margin: 0 auto;
        max-width: 84rem;
        padding: 0;
      }
      .question {
        margin-bottom: 5rem;
      }
      .question span {
        font-size: 24px;
        font-weight: 700;
      }
      .question-prompt {
        margin-top: 0.8rem;
        font-weight: 700;
      }
      .question-answer {
        margin-top: 1.6rem;
        padding-left: 0;
        box-sizing: border-box;
      }
      .question-answer label {
        max-width: 80rem;
        position: relative;
        cursor: pointer;
        display: flex;
        min-width: 18rem;
        border: solid #1c1d1f 2px;
      }
      .question-answer div {
        display: flex;
        align-items: center;
        padding: 0.5rem;
        width: 100%;
      }
      .question-answer div:hover {
        background-color: #f5f5f5;
      }
      .question-answer input {
        display: none;
      }
      .question-answer span {
        width: 1rem;
        height: 1rem;
        margin-right: 1.6rem;
        top: 0;
        border-radius: 50%;
        display: inline-block;
        flex-shrink: 0;
        border: 0.2rem solid #1c1d1f;
        position: relative;
      }
      .selected {
        background: #1c1d1f;
        box-shadow: 0 0 0 0.4rem #fff inset;
      }
      .score {
              position: fixed;
            }
    </style>
  </head>

  <body onload="main()">
    <div id="score" class="score">
      <span>Score: N/A of N/A</span>
    </div>
    <div id="quiz-container" class="quiz-content"></div>

    <script>
      const quizData = {"pass_percent": 70, "questions": [{"_class": "assessment", "id": 86259875, "assessment_type": "multiple-choice", "prompt": {"question": "<p>You are trying to recognize handwritten digits. How do neural network function for this use case?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>Neural networks function like a decision tree algorithm and will create a set of rules</p>", "<p>Neural networks will create a series of linear regression to identify numbers</p>", "<p>Neural networks will create several layers of interconnected nodes that will identify patterns in data</p>", "<p>Neural networks will create a database based on numbers and their pixel data</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "You are trying to recognize handwritten digits. How do neural network function for this use case?", "related_lectures": []}, {"_class": "assessment", "id": 86260129, "assessment_type": "multiple-choice", "prompt": {"question": "<p>You are building a robot that learns how to cut vegetables. You are rewarding it for parallels and fine cuts. You want the actions to be safe and efficient. Which machine learning approach do you recommend?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>Supervised learning</p>", "<p>Reinforcement learning</p>", "<p>Unsupervised learning</p>", "<p>Self-supervised learning</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "You are building a robot that learns how to cut vegetables. You are rewarding it for parallels and fine cuts. You want the actions to be safe and efficient. Which machine learning approach do you recommend?", "related_lectures": []}, {"_class": "assessment", "id": 86260131, "assessment_type": "multiple-choice", "prompt": {"question": "<p>When a model is neither underfitting nor overfitting, it will have\u2026</p>", "relatedLectureIds": "", "feedbacks": ["", ""], "answers": ["<p>low bias and low variance</p>", "<p>high bias and high variance</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "When a model is neither underfitting nor overfitting, it will have\u2026", "related_lectures": []}, {"_class": "assessment", "id": 86260387, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which AI application is used to automatically extract structured data from various types of documents, such as invoices, contracts, and forms?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>Computer vision</p>", "<p>Facial recognition</p>", "<p>Fraud detection</p>", "<p>Intelligent Document Processing (IDP)</p>"]}, "correct_response": ["d"], "section": "", "question_plain": "Which AI application is used to automatically extract structured data from various types of documents, such as invoices, contracts, and forms?", "related_lectures": []}, {"_class": "assessment", "id": 86260643, "assessment_type": "multiple-choice", "prompt": {"question": "<p>You are building a model to predict the sale price of used cars, based on several attributes such as the brand, total number of kilometers, year of construction, etc\u2026 Which machine learning technique is appropriate for this task?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>Clustering</p>", "<p>Dimensionality reduction</p>", "<p>Regression</p>", "<p>Classification</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "You are building a model to predict the sale price of used cars, based on several attributes such as the brand, total number of kilometers, year of construction, etc\u2026 Which machine learning technique is appropriate for this task?", "related_lectures": []}, {"_class": "assessment", "id": 86260903, "assessment_type": "multiple-choice", "prompt": {"question": "<p>What is the goal of feature engineering in the machine learning lifecycle?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>To transform data and create variables for the model</p>", "<p>To collect and clean data</p>", "<p>To calculate the model performance</p>", "<p>To maintain the desired level of performance</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "What is the goal of feature engineering in the machine learning lifecycle?", "related_lectures": []}, {"_class": "assessment", "id": 86260907, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company develops a machine learning model to predict stock prices. The model performs well on the training data but poorly on new, unseen data. Which option describes the fit of the model?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>It underfits.</p>", "<p>It has low variance.</p>", "<p>It overfits.</p>", "<p>It has high bias.</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "A company develops a machine learning model to predict stock prices. The model performs well on the training data but poorly on new, unseen data. Which option describes the fit of the model?", "related_lectures": []}]};
      var correct = 0;
      var total = 0;
      const questionData = quizData.questions
      const passPercent = quizData.pass_percent

      function main() {
        total = questionData.length;

        var questions = [];
        for (var i = 0; i < questionData.length; i++) {
          var question = questionData[i];
          var questionText = question.prompt.question;
          var answers = question.prompt.answers;
          var correctAnswer = question.correct_response[0];
          var correctAnswerText = answers[correctAnswer.charCodeAt(0) - 97];
          var questionObj = {
            question: questionText,
            correctAnswer: correctAnswerText,
            answers: answers,
            id: question.id,
          };
          questions.push(questionObj);
        }

        updateScore();

        // display the questions
        var questionsContainer = document.getElementById("quiz-container");
        for (var i = 0; i < questions.length; i++) {
          var question = questions[i];
          var questionElement = document.createElement("form");
          questionElement.className = "question";
          questionElement.innerHTML =
            "<span>Question " +
            (i + 1) +
            ":</span>" +
            '<div class="question-prompt">' +
            question.question +
            "</div>";
          questionElement.id = question.id;
          questionElement.classList.add("quiz-container");
          var answersElement = document.createElement("ul");
          answersElement.className = "answers";
          for (var j = 0; j < question.answers.length; j++) {
            var answer = question.answers[j];
            var answerElement = document.createElement("li");
            answerElement.className = "answer";
            answerElement.innerHTML =
              '<label for="input-' +
              question.id +
              "-" +
              j +
              '"><div onclick="select(' +
              question.id +
              ", " +
              j +
              ')"><span></span><input id="input-' +
              question.id +
              "-" +
              j +
              '" type="radio" name="question' +
              i +
              '" value="' +
              j +
              '">' +
              answer +
              "</input></div></label>";
            answerElement.classList.add("question-answer");
            answersElement.appendChild(answerElement);
          }

          questionElement.appendChild(answersElement);

          // add a submit button
          var submitButton = document.createElement("button");
          submitButton.className = "submit";
          submitButton.innerHTML = "Submit";
          submitButton.classList.add("submit-button");

          submitButton.addEventListener("click", function (e) {
            e.preventDefault();
            var questionElement = e.target.parentElement;
            var questionId = questionElement.id;
            var question = questions.filter(function (q) {
              return q.id == questionId;
            })[0];

            // set the border color of all answers to black
            var answers = questionElement.getElementsByClassName("answer");
            for (var i = 0; i < answers.length; i++) {
              console.log(answers[i]);
              answers[i].children[0].style.borderColor = "#1c1d1f";
            }

            var answer = questionElement.querySelector(
              'input[type="radio"]:checked'
            );
            if (answer) {
              var answerIndex = answer.value;
              var answerText = question.answers[answerIndex];
              if (answerText == question.correctAnswer) {
                answer.parentElement.parentElement.style.borderColor =
                  "limegreen";
                // alert("Correct!");
                correct++;
                updateScore();
              } else {
                answer.parentElement.parentElement.style.borderColor = "red";
                // alert("Incorrect!");
              }
            } else {
              alert("Please select an answer.");
            }
          });

          // add button
          questionElement.appendChild(submitButton);

          questionsContainer.appendChild(questionElement);
        }
      }

      function select(question, answer) {
        var questionElement = document.getElementById(question);
        var answers = questionElement.getElementsByClassName("answer");
        for (var i = 0; i < answers.length; i++) {
          var span = answers[i].children[0].children[0].children[0];
          var input = answers[i].children[0].children[0].children[1];
          span.classList.remove("selected");
          input.checked = false;
        }
        var span = answers[answer].children[0].children[0].children[0];
        var input = answers[answer].children[0].children[0].children[1];
        span.classList.add("selected");
        input.checked = true;
      }

      function updateScore() {
        var scoreElem = document.getElementById("score");
        const score = (correct / total) * 100;
        scoreElem.innerHTML = "Score: " + score + "/" + passPercent + "%";
      }
    </script>
  </body>
</html>

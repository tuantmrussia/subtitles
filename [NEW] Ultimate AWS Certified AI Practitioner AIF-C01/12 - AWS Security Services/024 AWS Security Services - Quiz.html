<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto,
          segoe ui, Helvetica, Arial, sans-serif, apple color emoji,
          segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      code {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .quiz-content {
        padding: 2.4rem;
        word-break: break-word;
        max-width: 86rem;
        margin: 0 auto;
      }
      .quiz-container {
        margin: 0 auto;
        max-width: 84rem;
        padding: 0;
      }
      .question {
        margin-bottom: 5rem;
      }
      .question span {
        font-size: 24px;
        font-weight: 700;
      }
      .question-prompt {
        margin-top: 0.8rem;
        font-weight: 700;
      }
      .question-answer {
        margin-top: 1.6rem;
        padding-left: 0;
        box-sizing: border-box;
      }
      .question-answer label {
        max-width: 80rem;
        position: relative;
        cursor: pointer;
        display: flex;
        min-width: 18rem;
        border: solid #1c1d1f 2px;
      }
      .question-answer div {
        display: flex;
        align-items: center;
        padding: 0.5rem;
        width: 100%;
      }
      .question-answer div:hover {
        background-color: #f5f5f5;
      }
      .question-answer input {
        display: none;
      }
      .question-answer span {
        width: 1rem;
        height: 1rem;
        margin-right: 1.6rem;
        top: 0;
        border-radius: 50%;
        display: inline-block;
        flex-shrink: 0;
        border: 0.2rem solid #1c1d1f;
        position: relative;
      }
      .selected {
        background: #1c1d1f;
        box-shadow: 0 0 0 0.4rem #fff inset;
      }
      .score {
              position: fixed;
            }
    </style>
  </head>

  <body onload="main()">
    <div id="score" class="score">
      <span>Score: N/A of N/A</span>
    </div>
    <div id="quiz-container" class="quiz-content"></div>

    <script>
      const quizData = {"pass_percent": 70, "questions": [{"_class": "assessment", "id": 87952111, "assessment_type": "multiple-choice", "prompt": {"question": "<p>What is a proper definition of IAM&nbsp;Roles?</p>", "relatedLectureIds": "", "feedbacks": ["Some AWS service will need to perform actions on your behalf. To do so, you assign permissions to AWS services with IAM Roles.", "IAM Users can belong in multiple Groups, but it's not the IAM Roles definition.", "IAM Roles permissions are not assigned to Users."], "answers": ["<p>An IAM entity that defines a set of permissions for making AWS service requests, that will be used by AWS&nbsp;services</p>", "<p>IAM&nbsp;Users in multiple Groups</p>", "<p>Permissions assigned to&nbsp;Users to perform actions</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "What is a proper definition of IAM&nbsp;Roles?", "related_lectures": []}, {"_class": "assessment", "id": 87952121, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which answer is INCORRECT&nbsp;regarding IAM&nbsp;Users?</p>", "relatedLectureIds": "", "feedbacks": ["IAM\u00a0Users can belong to multiple groups (if a user is part of different teams for example).", "IAM\u00a0Users don't necessarily have to belong to a group.", "You can assign policies to IAM Users to give them permissions.", "IAM Users access AWS using a username and a password."], "answers": ["<p>IAM&nbsp;Users can belong to multiple groups</p>", "<p>IAM&nbsp;Users don't have to belong to a group</p>", "<p>IAM&nbsp;Users can have policies assigned to them</p>", "<p>IAM&nbsp;Users access AWS&nbsp;with the root account credentials</p>"]}, "correct_response": ["d"], "section": "", "question_plain": "Which answer is INCORRECT&nbsp;regarding IAM&nbsp;Users?", "related_lectures": []}, {"_class": "assessment", "id": 87952125, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which of the following is an IAM&nbsp;best practice?</p>", "relatedLectureIds": "", "feedbacks": ["You only want to use the root account to create your first IAM user, and for a few account and service management tasks. For every day and administration tasks, use an IAM user with permissions.", "It is not an IAM best practice. You should create one user per physical person.", "It is not an IAM best practice. You never want to share your credentials."], "answers": ["<p>Don't use the root user account</p>", "<p>Create several users for a physical person</p>", "<p>Share credentials so a colleague can perform a task for you</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "Which of the following is an IAM&nbsp;best practice?", "related_lectures": []}, {"_class": "assessment", "id": 87952127, "assessment_type": "multiple-choice", "prompt": {"question": "<p>What are IAM&nbsp;Policies?</p>", "relatedLectureIds": "", "feedbacks": ["IAM Policies do not only define AWS services' performable actions.", "An IAM policy is an entity that, when attached to an identity or resource, defines their permissions.", "This is a password policy, not an IAM Policy."], "answers": ["<p>AWS&nbsp;services performable actions</p>", "<p>JSON&nbsp;documents to define Users, Groups or Roles' permissions</p>", "<p>Rules to set up a password for IAM&nbsp;Users</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "What are IAM&nbsp;Policies?", "related_lectures": []}, {"_class": "assessment", "id": 87952137, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which of the following services can you use to discover and protect your sensitive data in AWS?</p>", "relatedLectureIds": "", "feedbacks": ["", "", ""], "answers": ["<p>Macie</p>", "<p>Artifact</p>", "<p>Inspector</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "Which of the following services can you use to discover and protect your sensitive data in AWS?", "related_lectures": []}, {"_class": "assessment", "id": 87952145, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Where can you find on-demand access to AWS&nbsp;compliance documentation and AWS&nbsp;agreements?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>Inspector</p>", "<p>Artifact</p>", "<p>Config</p>", "<p>Macie</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "Where can you find on-demand access to AWS&nbsp;compliance documentation and AWS&nbsp;agreements?", "related_lectures": []}, {"_class": "assessment", "id": 87952149, "assessment_type": "multiple-choice", "prompt": {"question": "<p>You want to record configurations and changes over time. Which service allows you to do this?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>Inspector</p>", "<p>Config</p>", "<p>Lambda</p>", "<p>Macie</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "You want to record configurations and changes over time. Which service allows you to do this?", "related_lectures": []}]};
      var correct = 0;
      var total = 0;
      const questionData = quizData.questions
      const passPercent = quizData.pass_percent

      function main() {
        total = questionData.length;

        var questions = [];
        for (var i = 0; i < questionData.length; i++) {
          var question = questionData[i];
          var questionText = question.prompt.question;
          var answers = question.prompt.answers;
          var correctAnswer = question.correct_response[0];
          var correctAnswerText = answers[correctAnswer.charCodeAt(0) - 97];
          var questionObj = {
            question: questionText,
            correctAnswer: correctAnswerText,
            answers: answers,
            id: question.id,
          };
          questions.push(questionObj);
        }

        updateScore();

        // display the questions
        var questionsContainer = document.getElementById("quiz-container");
        for (var i = 0; i < questions.length; i++) {
          var question = questions[i];
          var questionElement = document.createElement("form");
          questionElement.className = "question";
          questionElement.innerHTML =
            "<span>Question " +
            (i + 1) +
            ":</span>" +
            '<div class="question-prompt">' +
            question.question +
            "</div>";
          questionElement.id = question.id;
          questionElement.classList.add("quiz-container");
          var answersElement = document.createElement("ul");
          answersElement.className = "answers";
          for (var j = 0; j < question.answers.length; j++) {
            var answer = question.answers[j];
            var answerElement = document.createElement("li");
            answerElement.className = "answer";
            answerElement.innerHTML =
              '<label for="input-' +
              question.id +
              "-" +
              j +
              '"><div onclick="select(' +
              question.id +
              ", " +
              j +
              ')"><span></span><input id="input-' +
              question.id +
              "-" +
              j +
              '" type="radio" name="question' +
              i +
              '" value="' +
              j +
              '">' +
              answer +
              "</input></div></label>";
            answerElement.classList.add("question-answer");
            answersElement.appendChild(answerElement);
          }

          questionElement.appendChild(answersElement);

          // add a submit button
          var submitButton = document.createElement("button");
          submitButton.className = "submit";
          submitButton.innerHTML = "Submit";
          submitButton.classList.add("submit-button");

          submitButton.addEventListener("click", function (e) {
            e.preventDefault();
            var questionElement = e.target.parentElement;
            var questionId = questionElement.id;
            var question = questions.filter(function (q) {
              return q.id == questionId;
            })[0];

            // set the border color of all answers to black
            var answers = questionElement.getElementsByClassName("answer");
            for (var i = 0; i < answers.length; i++) {
              console.log(answers[i]);
              answers[i].children[0].style.borderColor = "#1c1d1f";
            }

            var answer = questionElement.querySelector(
              'input[type="radio"]:checked'
            );
            if (answer) {
              var answerIndex = answer.value;
              var answerText = question.answers[answerIndex];
              if (answerText == question.correctAnswer) {
                answer.parentElement.parentElement.style.borderColor =
                  "limegreen";
                // alert("Correct!");
                correct++;
                updateScore();
              } else {
                answer.parentElement.parentElement.style.borderColor = "red";
                // alert("Incorrect!");
              }
            } else {
              alert("Please select an answer.");
            }
          });

          // add button
          questionElement.appendChild(submitButton);

          questionsContainer.appendChild(questionElement);
        }
      }

      function select(question, answer) {
        var questionElement = document.getElementById(question);
        var answers = questionElement.getElementsByClassName("answer");
        for (var i = 0; i < answers.length; i++) {
          var span = answers[i].children[0].children[0].children[0];
          var input = answers[i].children[0].children[0].children[1];
          span.classList.remove("selected");
          input.checked = false;
        }
        var span = answers[answer].children[0].children[0].children[0];
        var input = answers[answer].children[0].children[0].children[1];
        span.classList.add("selected");
        input.checked = true;
      }

      function updateScore() {
        var scoreElem = document.getElementById("score");
        const score = (correct / total) * 100;
        scoreElem.innerHTML = "Score: " + score + "/" + passPercent + "%";
      }
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto,
          segoe ui, Helvetica, Arial, sans-serif, apple color emoji,
          segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      ul,
      ol {
        font-size: 16px;
        font-weight: 400;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      code {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .quiz-content {
        padding: 2.4rem;
        word-break: break-word;
        max-width: 86rem;
        margin: 0 auto;
      }
      .quiz-container {
        margin: 0 auto;
        max-width: 84rem;
        padding: 0;
      }
      .question {
        margin-bottom: 5rem;
      }
      .question span {
        font-size: 24px;
        font-weight: 700;
      }
      .question-prompt {
        margin-top: 0.8rem;
        font-weight: 700;
      }
      .question-answer {
        margin-top: 1.6rem;
        padding-left: 0;
        box-sizing: border-box;
      }
      .question-answer label {
        max-width: 80rem;
        position: relative;
        cursor: pointer;
        display: flex;
        min-width: 18rem;
        border: solid #1c1d1f 2px;
      }
      .question-answer div {
        display: flex;
        align-items: center;
        padding: 0.5rem;
        width: 100%;
      }
      .question-answer div:hover {
        background-color: #f5f5f5;
      }
      .question-answer input {
        display: none;
      }
      .question-answer span {
        width: 1rem;
        height: 1rem;
        margin-right: 1.6rem;
        top: 0;
        border-radius: 50%;
        display: inline-block;
        flex-shrink: 0;
        border: 0.2rem solid #1c1d1f;
        position: relative;
      }
      .selected {
        background: #1c1d1f;
        box-shadow: 0 0 0 0.4rem #fff inset;
      }
      .score {
              position: fixed;
            }
    </style>
  </head>

  <body onload="main()">
    <div id="score" class="score">
      <span>Score: N/A of N/A</span>
    </div>
    <div id="quiz-container" class="quiz-content"></div>

    <script>
      const quizData = {"pass_percent": 70, "questions": [{"_class": "assessment", "id": 86259175, "assessment_type": "multiple-choice", "prompt": {"question": "<p>What is fine-tuning used for?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>Train a model from scratch</p>", "<p>Train a pre-trained foundational model on new specific data</p>", "<p>Adapt the model\u2019s performance by tuning hyperparameters</p>", "<p>Clean the training data to improve the model\u2019s quality</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "What is fine-tuning used for?", "related_lectures": []}, {"_class": "assessment", "id": 86259183, "assessment_type": "multiple-choice", "prompt": {"question": "<p>What type of generative AI can recognize and interpret various forms of input data, such as text, images, and audio?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>Large language model</p>", "<p>Diffusion model</p>", "<p>Multimodal model</p>", "<p>Foundation model</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "What type of generative AI can recognize and interpret various forms of input data, such as text, images, and audio?", "related_lectures": []}, {"_class": "assessment", "id": 86259187, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which features can help you ensure that your model will not output harmful content?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>Guardrails</p>", "<p>RAG &amp; Knowledge Bases</p>", "<p>Model Evaluation</p>", "<p>Fine-Tuning</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "Which features can help you ensure that your model will not output harmful content?", "related_lectures": []}, {"_class": "assessment", "id": 86259201, "assessment_type": "multiple-choice", "prompt": {"question": "<p>You need to be able to provide always-updated data to your foundation model without retraining it. Which capability best fits your use case?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>In-context learning</p>", "<p>Retrieval Augmented Generation (RAG)</p>", "<p>Pre-training</p>", "<p>Fine-Tuning</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "You need to be able to provide always-updated data to your foundation model without retraining it. Which capability best fits your use case?", "related_lectures": []}, {"_class": "assessment", "id": 86259207, "assessment_type": "multiple-choice", "prompt": {"question": "<p>You are developing a model and want to ensure the outputs are adapted to your users. Which method do you recommend?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>Automated testing</p>", "<p>Using benchmark datasets</p>", "<p>Code review</p>", "<p>Human evaluation</p>"]}, "correct_response": ["d"], "section": "", "question_plain": "You are developing a model and want to ensure the outputs are adapted to your users. Which method do you recommend?", "related_lectures": []}, {"_class": "assessment", "id": 86259213, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which AWS service can help store embeddings within vector databases?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>Amazon S3</p>", "<p>Amazon DynamoDB</p>", "<p>Amazon OpenSearch Serverless</p>", "<p>Amazon Kinesis Data Streams</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "Which AWS service can help store embeddings within vector databases?", "related_lectures": []}, {"_class": "assessment", "id": 86259217, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which statement about Amazon Bedrock is INCORRECT?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>Customers want access to multiple models to choose the best fit for their needs.</p>", "<p>Customers want the models fine-tuned with their data to be private.</p>", "<p>Customers do not want to manage their infrastructure.</p>", "<p>Customers want to build and train foundation models (FMs) from scratch.</p>"]}, "correct_response": ["d"], "section": "", "question_plain": "Which statement about Amazon Bedrock is INCORRECT?", "related_lectures": []}, {"_class": "assessment", "id": 86259223, "assessment_type": "multiple-choice", "prompt": {"question": "<p>What is a common use case for Amazon Bedrock?</p>", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "answers": ["<p>Demand forecasting</p>", "<p>Conversational chatbots with relevant data</p>", "<p>Extraction of text from images</p>", "<p>Predictive maintenance of vehicles</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "What is a common use case for Amazon Bedrock?", "related_lectures": []}]};
      var correct = 0;
      var total = 0;
      const questionData = quizData.questions
      const passPercent = quizData.pass_percent

      function main() {
        total = questionData.length;

        var questions = [];
        for (var i = 0; i < questionData.length; i++) {
          var question = questionData[i];
          var questionText = question.prompt.question;
          var answers = question.prompt.answers;
          var correctAnswer = question.correct_response[0];
          var correctAnswerText = answers[correctAnswer.charCodeAt(0) - 97];
          var questionObj = {
            question: questionText,
            correctAnswer: correctAnswerText,
            answers: answers,
            id: question.id,
          };
          questions.push(questionObj);
        }

        updateScore();

        // display the questions
        var questionsContainer = document.getElementById("quiz-container");
        for (var i = 0; i < questions.length; i++) {
          var question = questions[i];
          var questionElement = document.createElement("form");
          questionElement.className = "question";
          questionElement.innerHTML =
            "<span>Question " +
            (i + 1) +
            ":</span>" +
            '<div class="question-prompt">' +
            question.question +
            "</div>";
          questionElement.id = question.id;
          questionElement.classList.add("quiz-container");
          var answersElement = document.createElement("ul");
          answersElement.className = "answers";
          for (var j = 0; j < question.answers.length; j++) {
            var answer = question.answers[j];
            var answerElement = document.createElement("li");
            answerElement.className = "answer";
            answerElement.innerHTML =
              '<label for="input-' +
              question.id +
              "-" +
              j +
              '"><div onclick="select(' +
              question.id +
              ", " +
              j +
              ')"><span></span><input id="input-' +
              question.id +
              "-" +
              j +
              '" type="radio" name="question' +
              i +
              '" value="' +
              j +
              '">' +
              answer +
              "</input></div></label>";
            answerElement.classList.add("question-answer");
            answersElement.appendChild(answerElement);
          }

          questionElement.appendChild(answersElement);

          // add a submit button
          var submitButton = document.createElement("button");
          submitButton.className = "submit";
          submitButton.innerHTML = "Submit";
          submitButton.classList.add("submit-button");

          submitButton.addEventListener("click", function (e) {
            e.preventDefault();
            var questionElement = e.target.parentElement;
            var questionId = questionElement.id;
            var question = questions.filter(function (q) {
              return q.id == questionId;
            })[0];

            // set the border color of all answers to black
            var answers = questionElement.getElementsByClassName("answer");
            for (var i = 0; i < answers.length; i++) {
              console.log(answers[i]);
              answers[i].children[0].style.borderColor = "#1c1d1f";
            }

            var answer = questionElement.querySelector(
              'input[type="radio"]:checked'
            );
            if (answer) {
              var answerIndex = answer.value;
              var answerText = question.answers[answerIndex];
              if (answerText == question.correctAnswer) {
                answer.parentElement.parentElement.style.borderColor =
                  "limegreen";
                // alert("Correct!");
                correct++;
                updateScore();
              } else {
                answer.parentElement.parentElement.style.borderColor = "red";
                // alert("Incorrect!");
              }
            } else {
              alert("Please select an answer.");
            }
          });

          // add button
          questionElement.appendChild(submitButton);

          questionsContainer.appendChild(questionElement);
        }
      }

      function select(question, answer) {
        var questionElement = document.getElementById(question);
        var answers = questionElement.getElementsByClassName("answer");
        for (var i = 0; i < answers.length; i++) {
          var span = answers[i].children[0].children[0].children[0];
          var input = answers[i].children[0].children[0].children[1];
          span.classList.remove("selected");
          input.checked = false;
        }
        var span = answers[answer].children[0].children[0].children[0];
        var input = answers[answer].children[0].children[0].children[1];
        span.classList.add("selected");
        input.checked = true;
      }

      function updateScore() {
        var scoreElem = document.getElementById("score");
        const score = (correct / total) * 100;
        scoreElem.innerHTML = "Score: " + score + "/" + passPercent + "%";
      }
    </script>
  </body>
</html>

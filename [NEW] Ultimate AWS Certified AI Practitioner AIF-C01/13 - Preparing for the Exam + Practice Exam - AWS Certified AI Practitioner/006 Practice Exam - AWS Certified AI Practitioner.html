    <script>
      const quizData = {"pass_percent": 70, "questions": [{"_class": "assessment", "id": 86606313, "assessment_type": "multi-select", "prompt": {"question": "<p>You are a Large Language Model (LLM) developer at a company. The company wants to migrate to AWS Cloud. Which AWS services would you recommend for developing LLMs? (Select two)</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", "", ""], "explanation": "<p>Correct options:</p>\n\n<p>Large language models (LLM) are very large deep learning models that are pre-trained on vast amounts of data. The underlying transformer is a set of neural networks that consist of an encoder and a decoder with self-attention capabilities. The encoder and decoder extract meanings from a sequence of text and understand the relationships between words and phrases in it.</p>\n\n<p>Large language models (LLMs) are one class of Foundation Models. For example, OpenAI's generative pre-trained transformer (GPT) models are LLMs. LLMs are specifically focused on language-based tasks such as such as summarization, text generation, classification, open-ended conversation, and information extraction.</p>\n\n<p>AWS recommends AWS Bedrock and Amazon SageMaker JumpStart as the best-fit services for developing LLMs.</p>\n\n<p><strong>Amazon Bedrock</strong></p>\n\n<p>Amazon Bedrock is the easiest way to build and scale generative AI applications with foundation models. Amazon Bedrock is a fully managed service that makes foundation models from Amazon and leading AI startups available through an API, so you can choose from various FMs to find the model that's best suited for your use case. With Bedrock, you can speed up developing and deploying scalable, reliable, and secure generative AI applications without managing infrastructure.</p>\n\n<p><strong>Amazon SageMaker JumpStart</strong></p>\n\n<p>Amazon SageMaker JumpStart is a machine learning hub with foundation models, built-in algorithms, and prebuilt ML solutions that you can deploy with just a few clicks. With SageMaker JumpStart, you can access pre-trained models, including foundation models, to perform tasks like article summarization and image generation. Pretrained models are fully customizable for your use case with your data, and you can easily deploy them into production with the user interface or SDK.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Amazon Q</strong> - Amazon Q is a generative AI\u2013powered assistant for accelerating software development and leveraging companies' internal data. Amazon Q generates code, tests, and debugs. It has multistep planning and reasoning capabilities that can transform and implement new code generated from developer requests.</p>\n\n<p><strong>AWS Trainium</strong> - AWS Trainium is the machine learning (ML) chip that AWS purpose-built for deep learning (DL) training of 100B+ parameter models. Each Amazon Elastic Compute Cloud (Amazon EC2) Trn1 instance deploys up to 16 Trainium accelerators to deliver a high-performance, low-cost solution for DL training in the cloud.</p>\n\n<p><strong>AWS Inferentia</strong> - AWS Inferentia is an ML chip purpose-built by AWS to deliver high-performance inference at a low cost. AWS Inferentia accelerators are designed by AWS to deliver high performance at the lowest cost in Amazon EC2 for your deep learning (DL) and generative AI inference applications.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/what-is/large-language-model/\">https://aws.amazon.com/what-is/large-language-model/</a></p>\n\n<p><a href=\"https://aws.amazon.com/bedrock/\">https://aws.amazon.com/bedrock/</a></p>\n\n<p><a href=\"https://aws.amazon.com/sagemaker/jumpstart/\">https://aws.amazon.com/sagemaker/jumpstart/</a></p>\n\n<p><a href=\"https://aws.amazon.com/q/\">https://aws.amazon.com/q/</a></p>\n\n<p><a href=\"https://aws.amazon.com/machine-learning/trainium/\">https://aws.amazon.com/machine-learning/trainium/</a></p>\n", "answers": ["<p>Amazon Bedrock</p>", "<p>Amazon SageMaker JumpStart</p>", "<p>AWS Trainium</p>", "<p>Amazon Q</p>", "<p>AWS Inferentia</p>"]}, "correct_response": ["a", "b"], "section": "Generative AI", "question_plain": "You are a Large Language Model (LLM) developer at a company. The company wants to migrate to AWS Cloud. Which AWS services would you recommend for developing LLMs? (Select two)", "related_lectures": []}, {"_class": "assessment", "id": 86606315, "assessment_type": "multiple-choice", "prompt": {"question": "<p>A company wants to implement fully managed support for end-to-end Retrieval Augmented Generation (RAG) workflow in Amazon Bedrock.</p>\n\n<p>What do you recommend?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>Knowledge Bases for Amazon Bedrock</strong></p>\n\n<p>With Knowledge Bases for Amazon Bedrock, you can give FMs and agents contextual information from your company\u2019s private data sources for RAG to deliver more relevant, accurate, and customized responses</p>\n\n<p>Knowledge Bases for Amazon Bedrock takes care of the entire ingestion workflow of converting your documents into embeddings (vector) and storing the embeddings in a specialized vector database. Knowledge Bases for Amazon Bedrock supports popular databases for vector storage, including vector engine for Amazon OpenSearch Serverless, Pinecone, Redis Enterprise Cloud, Amazon Aurora (coming soon), and MongoDB (coming soon). If you do not have an existing vector database, Amazon Bedrock creates an OpenSearch Serverless vector store for you.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-aif-pt/assets/pt1-q9-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/bedrock/knowledge-bases/\">https://aws.amazon.com/bedrock/knowledge-bases/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Watermark detection for Amazon Bedrock</strong> -  The watermark detection mechanism allows you to identify images generated by Amazon Titan Image Generator, a foundation model that allows users to create realistic, studio-quality images in large volumes and at low cost, using natural language prompts. With watermark detection, you can increase transparency around AI-generated content by mitigating harmful content generation and reducing the spread of misinformation. You cannot use a watermark detection mechanism to implement RAG workflow in Amazon Bedrock.</p>\n\n<p><strong>Continued pretraining in Amazon Bedrock</strong> - In the continued pretraining process, you provide unlabeled data to pre-train a model by familiarizing it with certain types of inputs. You can provide data from specific topics to expose a model to those areas. The continued pretraining process will tweak the model parameters to accommodate the input data and improve its domain knowledge. You can use <code>continued pretraining</code> or <code>fine-tuning</code> for model customization in Amazon Bedrock. You cannot use continued pretraining to implement RAG workflow in Amazon Bedrock.</p>\n\n<p><strong>Guardrails for Amazon Bedrock</strong> - Guardrails for Amazon Bedrock help you implement safeguards for your generative AI applications based on your use cases and responsible AI policies. It helps control the interaction between users and FMs by filtering undesirable and harmful content, redacts personally identifiable information (PII), and enhances content safety and privacy in generative AI applications. You cannot use guardrails to implement RAG workflow in Amazon Bedrock.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/bedrock/faqs/\">https://aws.amazon.com/bedrock/faqs/</a></p>\n\n<p><a href=\"https://aws.amazon.com/bedrock/knowledge-bases/\">https://aws.amazon.com/bedrock/knowledge-bases/</a></p>\n\n<p><a href=\"https://aws.amazon.com/about-aws/whats-new/2024/04/watermark-detection-amazon-titan-image-generator-bedrock/\">https://aws.amazon.com/about-aws/whats-new/2024/04/watermark-detection-amazon-titan-image-generator-bedrock/</a></p>\n", "answers": ["<p>Knowledge Bases for Amazon Bedrock</p>", "<p>Watermark detection for Amazon Bedrock</p>", "<p>Continued pretraining in Amazon Bedrock</p>", "<p>Guardrails for Amazon Bedrock</p>"]}, "correct_response": ["a"], "section": "Generative AI", "question_plain": "A company wants to implement fully managed support for end-to-end Retrieval Augmented Generation (RAG) workflow in Amazon Bedrock.\n\nWhat do you recommend?", "related_lectures": []}, {"_class": "assessment", "id": 86606317, "assessment_type": "multi-select", "prompt": {"question": "<p>Which of the following generative AI techniques are used in Amazon Q Business web application workflow? (Select two)</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", "", ""], "explanation": "<p>Correct options:</p>\n\n<p><strong>Large Language Model (LLM)</strong></p>\n\n<p>Large language models (LLMs) are a class of Foundation Models (FMs). For example, OpenAI's generative pre-trained transformer (GPT) models are LLMs. LLMs are specifically focused on language-based tasks such as such as summarization, text generation, classification, open-ended conversation, and information extraction.</p>\n\n<p><strong>Retrieval-Augmented Generation (RAG)</strong></p>\n\n<p>Retrieval-Augmented Generation (RAG) is the process of optimizing the output of a large language model, so it references an authoritative knowledge base outside of its training data sources before generating a response. Large Language Models (LLMs) are trained on vast volumes of data and use billions of parameters to generate original output for tasks like answering questions, translating languages, and completing sentences. RAG extends the already powerful capabilities of LLMs to specific domains or an organization's internal knowledge base, all without the need to retrain the model. It is a cost-effective approach to improving LLM output so it remains relevant, accurate, and useful in various contexts.</p>\n\n<p>Depending on the configuration, Amazon Q Business web application workflow can use LLM/RAG or both.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-aif-pt/assets/pt1-q19-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/how-it-works.html\">https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/how-it-works.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Diffusion Model</strong> - Diffusion models create new data by iteratively making controlled random changes to an initial data sample. They start with the original data and add subtle changes (noise), progressively making it less similar to the original. This noise is carefully controlled to ensure the generated data remains coherent and realistic. After adding noise over several iterations, the diffusion model reverses the process. Reverse denoising gradually removes the noise to produce a new data sample that resembles the original.</p>\n\n<p><strong>Generative adversarial network (GAN)</strong> - GANs work by training two neural networks in a competitive manner. The first network, known as the generator, generates fake data samples by adding random noise. The second network, called the discriminator, tries to distinguish between real data and the fake data produced by the generator. During training, the generator continually improves its ability to create realistic data while the discriminator becomes better at telling real from fake. This adversarial process continues until the generator produces data that is so convincing that the discriminator can't differentiate it from real data.</p>\n\n<p><strong>Variational autoencoders (VAE)</strong> - VAEs use two neural networks\u2014the encoder and the decoder. The encoder neural network maps the input data to a mean and variance for each dimension of the latent space. It generates a random sample from a Gaussian (normal) distribution. This sample is a point in the latent space and represents a compressed, simplified version of the input data. The decoder neural network takes this sampled point from the latent space and reconstructs it back into data that resembles the original input.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/what-is/generative-ai/\">https://aws.amazon.com/what-is/generative-ai/</a></p>\n\n<p><a href=\"https://aws.amazon.com/what-is/retrieval-augmented-generation/\">https://aws.amazon.com/what-is/retrieval-augmented-generation/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/how-it-works.html\">https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/how-it-works.html</a></p>\n", "answers": ["<p>Large Language Model (LLM)</p>", "<p>Diffusion Model</p>", "<p>Retrieval-Augmented Generation (RAG)</p>", "<p>Generative adversarial network (GAN)</p>", "<p>Variational autoencoders (VAE)</p>"]}, "correct_response": ["a", "c"], "section": "AWS AI Services", "question_plain": "Which of the following generative AI techniques are used in Amazon Q Business web application workflow? (Select two)", "related_lectures": []}, {"_class": "assessment", "id": 86606319, "assessment_type": "multiple-choice", "prompt": {"question": "<p>The marketing department at a media company wants to leverage Amazon Bedrock for making creative scripts for an upcoming ad campaign.</p>\n\n<p>What do you recommend?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>Use higher <code>Temperature</code> to get more creative responses for the same prompt on Amazon Bedrock</strong></p>\n\n<p>Temperature is a value between 0 and 1, and it regulates the creativity of the model's responses. Use a lower temperature if you want more deterministic responses, and use a higher temperature if you want creative or different responses for the same prompt on Amazon Bedrock.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-aif-pt/assets/pt1-q21-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html\">https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use higher <code>Top-P</code> to get more creative responses for the same prompt on Amazon Bedrock</strong></p>\n\n<p><strong>Use lower <code>Top-P</code> to get more creative responses for the same prompt on Amazon Bedrock</strong></p>\n\n<p>The inference parameter <code>Top P</code> represents the percentage of most likely candidates that the model considers for the next token. So, both these options serve as distractors for the given use case.</p>\n\n<p><strong>Use lower <code>Temperature</code> to get more creative responses for the same prompt on Amazon Bedrock</strong> - Use lower temperature if you want more deterministic responses, and use higher temperature if you want creative or different responses for the same prompt on Amazon Bedrock. So, this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html\">https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/general-guidelines-for-bedrock-users.html\">https://docs.aws.amazon.com/bedrock/latest/userguide/general-guidelines-for-bedrock-users.html</a></p>\n", "answers": ["<p>Use higher <code>Top-P</code> to get more creative responses for the same prompt on Amazon Bedrock</p>", "<p>Use lower <code>Temperature</code> to get more creative responses for the same prompt on Amazon Bedrock</p>", "<p>Use higher <code>Temperature</code> to get more creative responses for the same prompt on Amazon Bedrock</p>", "<p>Use lower <code>Top-P</code> to get more creative responses for the same prompt on Amazon Bedrock</p>"]}, "correct_response": ["c"], "section": "Artificial Intelligence", "question_plain": "The marketing department at a media company wants to leverage Amazon Bedrock for making creative scripts for an upcoming ad campaign.\n\nWhat do you recommend?", "related_lectures": []}, {"_class": "assessment", "id": 86606321, "assessment_type": "multi-select", "prompt": {"question": "<p>Which of the following are correct statements regarding the AWS Global Infrastructure? (Select two)</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", "", ""], "explanation": "<p>Correct options:</p>\n\n<p><strong>Each AWS Region consists of a minimum of three Availability Zones (AZ)</strong></p>\n\n<p><strong>Each Availability Zone (AZ) consists of one or more discrete data centers</strong></p>\n\n<p>AWS has the concept of a Region, which is a physical location around the world where AWS clusters its data centers. AWS calls each group of logical data centers an Availability Zone (AZ). Each AWS Region consists of a minimum of three, isolated, and physically separate AZs within a geographic area. Each AZ has independent power, cooling, and physical security and is connected via redundant, ultra-low-latency networks.</p>\n\n<p>An Availability Zone (AZ) is one or more discrete data centers with redundant power, networking, and connectivity in an AWS Region. All AZs in an AWS Region are interconnected with high-bandwidth, low-latency networking, over fully redundant, dedicated metro fiber providing high-throughput, low-latency networking between AZs.</p>\n\n<p>AWS Regions and Availability Zones Overview:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-aif-pt/assets/pt1-q29-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regions_az/\">https://aws.amazon.com/about-aws/global-infrastructure/regions_az/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Each AWS Region consists of a minimum of two Availability Zones (AZ)</strong></p>\n\n<p><strong>Each Availability Zone (AZ) consists of two or more discrete data centers</strong></p>\n\n<p><strong>Each AWS Region consists of two or more Edge Locations</strong></p>\n\n<p>These three options contradict the details provided earlier in the explanation, so these options are incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regions_az/\">https://aws.amazon.com/about-aws/global-infrastructure/regions_az/</a></p>\n", "answers": ["<p>Each AWS Region consists of a minimum of two Availability Zones (AZ)</p>", "<p>Each AWS Region consists of a minimum of three Availability Zones (AZ)</p>", "<p>Each Availability Zone (AZ) consists of one or more discrete data centers</p>", "<p>Each Availability Zone (AZ) consists of two or more discrete data centers</p>", "<p>Each AWS Region consists of two or more Edge Locations</p>"]}, "correct_response": ["b", "c"], "section": "Cloud Concepts", "question_plain": "Which of the following are correct statements regarding the AWS Global Infrastructure? (Select two)", "related_lectures": []}, {"_class": "assessment", "id": 86606323, "assessment_type": "multiple-choice", "prompt": {"question": "<p>In the context of the shared responsibility model for AWS cloud services, which of the following best describes the division of responsibilities between the customer and AWS?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>AWS is responsible for the security \"of\" the cloud, including infrastructure, hardware, and software, while the customer is responsible for security \"in\" the cloud, including data, applications, and access management</strong></p>\n\n<p>In the shared responsibility model, AWS is responsible for the security of the cloud, which includes the physical security of data centers, networking infrastructure, and hardware. The customer is responsible for security in the cloud, which includes securing their data, managing access and identity, configuring network settings, and ensuring application security.</p>\n\n<p>Shared Responsibility Model Overview:\n<img src=\"https://d1.awsstatic.com/security-center/Shared_Responsibility_Model_V2.59d1eccec334b366627e9295b304202faf7b899b.jpg\">\nvia - <a href=\"https://aws.amazon.com/compliance/shared-responsibility-model/\">https://aws.amazon.com/compliance/shared-responsibility-model/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>AWS is responsible for configuring and managing the security settings of the customer's applications, while the customer is responsible for the underlying hardware infrastructure</strong> - AWS manages the underlying infrastructure, including the hardware, but the customer is responsible for configuring and managing the security settings of their applications.</p>\n\n<p><strong>AWS handles all security aspects including data encryption, user access management, and application security, while the customer only needs to manage their virtual machines</strong> - AWS does not handle all aspects of security; customers must manage their own data encryption, user access management, and application security.</p>\n\n<p><strong>Customers are responsible for ensuring the physical security of data centers, while AWS is responsible for monitoring network traffic and managing user identities</strong> - Customers do not manage the physical security of data centers; AWS is responsible for this aspect of security.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/compliance/shared-responsibility-model/\">https://aws.amazon.com/compliance/shared-responsibility-model/</a></p>\n", "answers": ["<p>AWS is responsible for configuring and managing the security settings of the customer's applications, while the customer is responsible for the underlying hardware infrastructure</p>", "<p>AWS is responsible for the security \"of\" the cloud, including infrastructure, hardware, and software, while the customer is responsible for security \"in\" the cloud, including data, applications, and access management</p>", "<p>AWS handles all security aspects including data encryption, user access management, and application security, while the customer only needs to manage their virtual machines</p>", "<p>Customers are responsible for ensuring the physical security of data centers, while AWS is responsible for monitoring network traffic and managing user identities</p>"]}, "correct_response": ["b"], "section": "Cloud Concepts", "question_plain": "In the context of the shared responsibility model for AWS cloud services, which of the following best describes the division of responsibilities between the customer and AWS?", "related_lectures": []}, {"_class": "assessment", "id": 86606325, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which of the following techniques is used by Foundation models to create labels from input data?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>Self-supervised learning</strong></p>\n\n<p>It works when models are provided vast amounts of raw, almost entirely, or completely unlabeled data and then generate the labels themselves.</p>\n\n<p>Foundation models use self-supervised learning to create labels from input data. In self-supervised learning, models are provided vast amounts of raw completely unlabeled data and then the models generate the labels themselves. This means no one has instructed or trained the model with labeled training data sets.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Supervised learning</strong> - Reinforcement learning is a method with reward values attached to the different steps that the algorithm must go through. So the model\u2019s goal is to accumulate as many reward points as possible and eventually reach an end goal.</p>\n\n<p><strong>Supervised learning</strong> - In supervised learning, models are supplied with labeled and defined training data to assess for correlations. The sample data specifies both the input and the output for the model. For example, images of handwritten figures are annotated to indicate which number they correspond to. A supervised learning system could recognize the clusters of pixels and shapes associated with each number, given sufficient examples.</p>\n\n<p>Data labeling is the process of categorizing input data with its corresponding defined output values. Labeled training data is required for supervised learning. For example, millions of apple and banana images would need to be tagged with the words \u201capple\u201d or \u201cbanana.\u201d Then machine learning applications could use this training data to guess the name of the fruit when given a fruit image.</p>\n\n<p><strong>Unsupervised learning</strong> - Unsupervised learning algorithms train on unlabeled data. They scan through new data, trying to establish meaningful connections between the inputs and predetermined outputs. They can spot patterns and categorize data. For example, unsupervised algorithms could group news articles from different news sites into common categories like sports, crime, etc. They can use natural language processing to comprehend meaning and emotion in the article.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/what-is/foundation-models/\">https://aws.amazon.com/what-is/foundation-models/</a></p>\n\n<p><a href=\"https://aws.amazon.com/what-is/machine-learning/\">https://aws.amazon.com/what-is/machine-learning/</a></p>\n", "answers": ["<p>Reinforcement learning</p>", "<p>Self-supervised learning</p>", "<p>Supervised learning</p>", "<p>Unsupervised learning</p>"]}, "correct_response": ["b"], "section": "Generative AI", "question_plain": "Which of the following techniques is used by Foundation models to create labels from input data?", "related_lectures": []}, {"_class": "assessment", "id": 86606327, "assessment_type": "multi-select", "prompt": {"question": "<p>Which of the following applies to Amazon Bedrock? (Select two)</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", "", ""], "explanation": "<p>Correct options:</p>\n\n<p>With Amazon Bedrock, you will be charged for model inference and customization. You have a choice of two pricing plans for inference: 1. On-Demand and Batch: This mode allows you to use FMs on a pay-as-you-go basis without having to make any time-based term commitments. 2. Provisioned Throughput: This mode allows you to provision sufficient throughput to meet your application's performance requirements in exchange for a time-based term commitment.</p>\n\n<p><strong>Smaller models are cheaper to use than larger models</strong></p>\n\n<p>The cost of generative AI models can vary. It's important to weigh the trade-offs between model size and speed. Larger models tend to be more accurate but are costly and have limited deployment options. In contrast, smaller models are more affordable and faster, offering more deployment flexibility.</p>\n\n<p><strong>You can use a customized model only in the Provisioned Throughput mode</strong></p>\n\n<p>With the Provisioned Throughput mode, you can purchase model units for a specific base or custom model. The Provisioned Throughput mode is primarily designed for large consistent inference workloads that need guaranteed throughput. Custom models can only be accessed using Provisioned Throughput.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-aif-pt/assets/pt2-q8-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/bedrock/pricing/\">https://aws.amazon.com/bedrock/pricing/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>You can use the On-Demand mode only with time-based term commitments</strong> - With the On-Demand mode, you only pay for what you use, with no time-based term commitments. So, this option is incorrect.</p>\n\n<p><strong>Larger models are cheaper to use than smaller models</strong> - As mentioned above, larger models tend to be more accurate but are costly and have limited deployment options. In contrast, smaller models are more affordable and faster, offering more deployment flexibility.</p>\n\n<p><strong>You can use a customized model in the Provisioned Throughput or On-Demand mode</strong> - Custom models can only be accessed using Provisioned Throughput. So, this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/bedrock/pricing/\">https://aws.amazon.com/bedrock/pricing/</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/machine-learning/best-practices-to-build-generative-ai-applications-on-aws/\">https://aws.amazon.com/blogs/machine-learning/best-practices-to-build-generative-ai-applications-on-aws/</a></p>\n", "answers": ["<p>You can use the On-Demand mode only with time-based term commitments</p>", "<p>Larger models are cheaper to use than smaller models</p>", "<p>You can use a customized model in the Provisioned Throughput or On-Demand mode</p>", "<p>Smaller models are cheaper to use than larger models</p>", "<p>You can use a customized model only in the Provisioned Throughput mode</p>"]}, "correct_response": ["d", "e"], "section": "Generative AI", "question_plain": "Which of the following applies to Amazon Bedrock? (Select two)", "related_lectures": []}, {"_class": "assessment", "id": 86606329, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which of the following is correct regarding Foundation Models (FMs) in the context of generative AI?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>FMs use unlabeled training data sets for self-supervised learning</strong></p>\n\n<p>In supervised learning, you train the model with a set of input data and a corresponding set of paired labeled output data. Unsupervised machine learning is when you give the algorithm input data without any labeled output data. Then, on its own, the algorithm identifies patterns and relationships in and between the data. Self-supervised learning is a machine learning approach that applies unsupervised learning methods to tasks usually requiring supervised learning. Instead of using labeled datasets for guidance, self-supervised models create implicit labels from unstructured data.</p>\n\n<p>Foundation models use self-supervised learning to create labels from input data. This means no one has instructed or trained the model with labeled training data sets.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-aif-pt/assets/pt2-q22-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/what-is/foundation-models/\">https://aws.amazon.com/what-is/foundation-models/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>FMs use labeled training data sets for self-supervised learning</strong></p>\n\n<p><strong>FMs use labeled training data sets for supervised learning</strong></p>\n\n<p><strong>FMs use unlabeled training data sets for supervised learning</strong></p>\n\n<p>These three options contradict the explanation provided above, so these options are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/what-is/foundation-models/\">https://aws.amazon.com/what-is/foundation-models/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-fine-tuning.html\">https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-fine-tuning.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/compare/the-difference-between-machine-learning-supervised-and-unsupervised/\">https://aws.amazon.com/compare/the-difference-between-machine-learning-supervised-and-unsupervised/</a></p>\n", "answers": ["<p>FMs use labeled training data sets for self-supervised learning</p>", "<p>FMs use labeled training data sets for supervised learning</p>", "<p>FMs use unlabeled training data sets for supervised learning</p>", "<p>FMs use unlabeled training data sets for self-supervised learning</p>"]}, "correct_response": ["d"], "section": "Generative AI", "question_plain": "Which of the following is correct regarding Foundation Models (FMs) in the context of generative AI?", "related_lectures": []}, {"_class": "assessment", "id": 86606331, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which of the following summarizes the capabilities of a multimodal model?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>A multimodal model can accept a mix of input types such as audio/text and create a mix of output types such as video/image</strong></p>\n\n<p>A multimodal model is an artificial intelligence system designed to process and understand multiple types of data, such as text, images, audio, and video. Unlike unimodal models, which handle a single type of data, multimodal models can integrate and make sense of information from various sources, allowing them to perform more complex and versatile tasks.</p>\n\n<p>Multimodal models represent a significant advancement in AI, enabling the integration and understanding of multiple types of data. By combining different modalities, these models can perform a wide range of complex tasks, making them highly versatile and powerful tools in various fields.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>A multimodal model can accept only a single type of input and it can only create a single type of output</strong></p>\n\n<p><strong>A multimodal model can accept a mix of input types such as audio/text, however, it can only create a single type of output</strong></p>\n\n<p><strong>A multimodal model can accept only a single type of input, however, it can create a mix of output types such as video/image</strong></p>\n\n<p>These three options contradict the explanation provided above, so these options are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/industries/multimodal-data-analysis-with-aws-health-and-machine-learning-services/\">https://aws.amazon.com/blogs/industries/multimodal-data-analysis-with-aws-health-and-machine-learning-services/</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/industries/training-machine-learning-models-on-multimodal-health-data-with-amazon-sagemaker/\">https://aws.amazon.com/blogs/industries/training-machine-learning-models-on-multimodal-health-data-with-amazon-sagemaker/</a></p>\n", "answers": ["<p>A multimodal model can accept only a single type of input and it can only create a single type of output</p>", "<p>A multimodal model can accept a mix of input types such as audio/text, however, it can only create a single type of output</p>", "<p>A multimodal model can accept a mix of input types such as audio/text and create a mix of output types such as video/image</p>", "<p>A multimodal model can accept only a single type of input, however, it can create a mix of output types such as video/image</p>"]}, "correct_response": ["c"], "section": "Generative AI", "question_plain": "Which of the following summarizes the capabilities of a multimodal model?", "related_lectures": []}, {"_class": "assessment", "id": 86606333, "assessment_type": "multiple-choice", "prompt": {"question": "<p>What is one of the primary challenges in machine learning implementation?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>Difficulty in collecting and preparing high-quality data for training models</strong></p>\n\n<p>One of the main challenges in machine learning implementation is the difficulty in collecting and preparing high-quality data for training models. High-quality data is essential for building effective machine learning models, and ensuring that the data is clean, relevant, and well-prepared can be a complex and time-consuming process.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-aif-pt/assets/pt2-q27-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/what-is/machine-learning/\">https://aws.amazon.com/what-is/machine-learning/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Lack of available machine learning algorithms</strong> - There are many machine learning algorithms available, but the challenge lies in other aspects of implementation.</p>\n\n<p><strong>Insufficient computational power to run basic machine learning models</strong> - While computational power can be a challenge for very large models, it is not a primary challenge for most machine learning implementations due to the availability of powerful computing resources.</p>\n\n<p><strong>Limited applications of machine learning in real-world scenarios</strong> - Machine learning has a wide range of applications in real-world scenarios, and its use is not particularly limited.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/what-is/machine-learning/\">https://aws.amazon.com/what-is/machine-learning/</a></p>\n", "answers": ["<p>Lack of available machine learning algorithms</p>", "<p>Insufficient computational power to run basic machine learning models</p>", "<p>Difficulty in collecting and preparing high-quality data for training models</p>", "<p>Limited applications of machine learning in real-world scenarios</p>"]}, "correct_response": ["c"], "section": "Artificial Intelligence", "question_plain": "What is one of the primary challenges in machine learning implementation?", "related_lectures": []}, {"_class": "assessment", "id": 86606335, "assessment_type": "multiple-choice", "prompt": {"question": "<p>How would you differentiate between overfitting and underfitting in the context of machine learning?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>Overfitting occurs when a model performs well on the training data but poorly on new, unseen data, while underfitting occurs when a model performs poorly on both the training data and new, unseen data</strong></p>\n\n<p>Overfitting happens when a model learns the training data too well, including noise and outliers, leading to excellent performance on the training data but poor generalization to new, unseen data. Underfitting occurs when a model is too simplistic to capture the underlying patterns in the data, resulting in poor performance on both the training data and new data.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-aif-pt/assets/pt2-q34-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/machine-learning/latest/dg/model-fit-underfitting-vs-overfitting.html\">https://docs.aws.amazon.com/machine-learning/latest/dg/model-fit-underfitting-vs-overfitting.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Overfitting occurs when a model is too simple to capture the underlying patterns in the data, while underfitting occurs when a model is too complex and captures noise rather than the actual patterns</strong> - This option reverses the definitions of overfitting and underfitting.</p>\n\n<p><strong>Overfitting is desirable as it ensures the model captures all nuances in the training data, while underfitting is desirable as it ensures the model generalizes well to new data</strong> - Overfitting is generally undesirable because it reduces a model\u2019s ability to generalize to new data, while underfitting is also undesirable because the model fails to capture important patterns in the data.</p>\n\n<p><strong>Overfitting and underfitting both refer to a model performing equally well on both the training data and new, unseen data</strong> - Both overfitting and underfitting are problematic, leading to poor model performance on new data, and not equal performance on training and new data.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/machine-learning/latest/dg/model-fit-underfitting-vs-overfitting.html\">https://docs.aws.amazon.com/machine-learning/latest/dg/model-fit-underfitting-vs-overfitting.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/what-is/overfitting/\">https://aws.amazon.com/what-is/overfitting/</a></p>\n", "answers": ["<p>Overfitting occurs when a model performs well on the training data but poorly on new, unseen data, while underfitting occurs when a model performs poorly on both the training data and new, unseen data</p>", "<p>Overfitting occurs when a model is too simple to capture the underlying patterns in the data, while underfitting occurs when a model is too complex and captures noise rather than the actual patterns</p>", "<p>Overfitting is desirable as it ensures the model captures all nuances in the training data, while underfitting is desirable as it ensures the model generalizes well to new data</p>", "<p>Overfitting and underfitting both refer to a model performing equally well on both the training data and new, unseen data</p>"]}, "correct_response": ["a"], "section": "Artificial Intelligence", "question_plain": "How would you differentiate between overfitting and underfitting in the context of machine learning?", "related_lectures": []}, {"_class": "assessment", "id": 86606337, "assessment_type": "multi-select", "prompt": {"question": "<p>Which AWS services/tools can be used to implement Responsible AI practices? (Select two)</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", "", ""], "explanation": "<p>Correct options:</p>\n\n<p><strong>Amazon SageMaker Clarify</strong></p>\n\n<p>Amazon SageMaker Clarify is a service provided by AWS (Amazon Web Services) that helps developers detect biases and explain the predictions made by machine learning models. It is part of the Amazon SageMaker suite of machine learning tools and focuses on enhancing transparency, fairness, and explainability in machine learning workflows.</p>\n\n<p><strong>Amazon SageMaker Model Monitor</strong></p>\n\n<p>Amazon SageMaker Model Monitor is a service within the Amazon SageMaker suite that helps developers continuously monitor machine learning models deployed in production. It ensures that models maintain optimal performance and make accurate predictions over time by detecting data quality issues, concept drift, and other anomalies. Amazon SageMaker Model Monitor automatically detects and alerts you to inaccurate predictions from deployed models.</p>\n\n<p>Tools and resources to build AI responsibly:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-aif-pt/assets/pt2-q46-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/machine-learning/responsible-ai/resources/\">https://aws.amazon.com/machine-learning/responsible-ai/resources/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Amazon SageMaker JumpStart</strong> - Amazon SageMaker JumpStart is a machine learning hub with foundation models, built-in algorithms, and prebuilt ML solutions that you can deploy with just a few clicks.</p>\n\n<p><strong>Amazon Inspector</strong> - Amazon Inspector is an automated vulnerability management service that continually scans AWS workloads for software vulnerabilities and unintended network exposure.</p>\n\n<p><strong>AWS Audit Manager</strong> - AWS Audit Manager helps you assess internal risk with prebuilt frameworks that translate evidence from cloud services into security IT audit reports.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/machine-learning/responsible-ai/resources/\">https://aws.amazon.com/machine-learning/responsible-ai/resources/</a></p>\n\n<p><a href=\"https://aws.amazon.com/sagemaker/clarify/\">https://aws.amazon.com/sagemaker/clarify/</a></p>\n\n<p><a href=\"https://aws.amazon.com/sagemaker/ml-governance/\">https://aws.amazon.com/sagemaker/ml-governance/</a></p>\n", "answers": ["<p>Amazon SageMaker Clarify</p>", "<p>Amazon SageMaker JumpStart</p>", "<p>Amazon Inspector</p>", "<p>AWS Audit Manager</p>", "<p>Amazon SageMaker Model Monitor</p>"]}, "correct_response": ["a", "e"], "section": "Responsible AI", "question_plain": "Which AWS services/tools can be used to implement Responsible AI practices? (Select two)", "related_lectures": []}, {"_class": "assessment", "id": 86606339, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which of the following summarizes the differences between Guardrails for Amazon Bedrock and watermark detection for Amazon Bedrock?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>Guardrails helps control the interaction between users and FMs by filtering undesirable and harmful content, whereas, watermark detection identifies if an image was created by the Amazon Titan Image Generator model on Bedrock</strong></p>\n\n<p>Guardrails for Amazon Bedrock help you implement safeguards for your generative AI applications based on your use cases and responsible AI policies. Guardrails for Amazon Bedrock helps control the interaction between users and FMs by filtering undesirable and harmful content as well as redacting personally identifiable information (PII), enhancing content safety and privacy in generative AI applications.</p>\n\n<p>Watermark detection is a security feature in Amazon Bedrock that identifies if an image was created by the Amazon Titan Image Generator model on Bedrock.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Both Guardrails and watermark detection help control the interaction between users and FMs by filtering undesirable and harmful content</strong></p>\n\n<p><strong>Watermark detection helps control the interaction between users and FMs by filtering undesirable and harmful content, whereas, Guardrails identifies if an image was created by the Amazon Titan Image Generator model on Bedrock</strong></p>\n\n<p><strong>Both Guardrails and watermark detection help identify if an image was created by the Amazon Titan Image Generator model on Bedrock</strong></p>\n\n<p>These three options contradict the explanation provided above, so these options are incorrect.</p>\n\n<p>References:</p>\n", "answers": ["<p>Both Guardrails and watermark detection help control the interaction between users and FMs by filtering undesirable and harmful content</p>", "<p>Guardrails helps control the interaction between users and FMs by filtering undesirable and harmful content, whereas, watermark detection identifies if an image was created by the Amazon Titan Image Generator model on Bedrock</p>", "<p>Watermark detection helps control the interaction between users and FMs by filtering undesirable and harmful content, whereas, Guardrails identifies if an image was created by the Amazon Titan Image Generator model on Bedrock</p>", "<p>Both Guardrails and watermark detection help identify if an image was created by the Amazon Titan Image Generator model on Bedrock</p>"]}, "correct_response": ["b"], "section": "AWS AI Services", "question_plain": "Which of the following summarizes the differences between Guardrails for Amazon Bedrock and watermark detection for Amazon Bedrock?", "related_lectures": []}, {"_class": "assessment", "id": 86606341, "assessment_type": "multiple-choice", "prompt": {"question": "<p>What is a key difference between structured data and unstructured data in the context of Machine Learning?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>Structured data is organized in a predefined manner, often in rows and columns, making it easy to search and analyze, while unstructured data lacks a specific format and includes data like text, images, and videos</strong></p>\n\n<p>Structured data is highly organized and formatted, typically found in databases and spreadsheets, making it straightforward to search and analyze. Unstructured data, on the other hand, does not have a predefined format and can include diverse data types such as text, images, and videos.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-aif-pt/assets/pt3-q24-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/compare/the-difference-between-structured-data-and-unstructured-data/\">https://aws.amazon.com/compare/the-difference-between-structured-data-and-unstructured-data/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Structured data is typically freeform text that lacks any specific format, whereas unstructured data is organized in a tabular format with rows and columns</strong> - Structured data is not freeform text; it is organized in a specific format, usually in rows and columns. Unstructured data does not have a predefined format.</p>\n\n<p><strong>Structured data includes data like text, images, and videos, whereas unstructured data is limited to numerical data only</strong> - Structured data is not limited to numerical data; it can include various data types as long as it is organized. Unstructured data includes data types like text, images, and videos.</p>\n\n<p><strong>Structured data is used exclusively for training machine learning models, whereas unstructured data is used solely for storing information without any analytical purpose</strong> - Both structured and unstructured data can be used for training machine learning models and for various analytical purposes, not just storage.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/compare/the-difference-between-structured-data-and-unstructured-data/\">https://aws.amazon.com/compare/the-difference-between-structured-data-and-unstructured-data/</a></p>\n", "answers": ["<p>Structured data is typically freeform text that lacks any specific format, whereas unstructured data is organized in a tabular format with rows and columns</p>", "<p>Structured data is organized in a predefined manner, often in rows and columns, making it easy to search and analyze, while unstructured data lacks a specific format and includes data like text, images, and videos</p>", "<p>Structured data includes data like text, images, and videos, whereas unstructured data is limited to numerical data only</p>", "<p>Structured data is used exclusively for training machine learning models, whereas unstructured data is used solely for storing information without any analytical purpose</p>"]}, "correct_response": ["b"], "section": "Artificial Intelligence", "question_plain": "What is a key difference between structured data and unstructured data in the context of Machine Learning?", "related_lectures": []}, {"_class": "assessment", "id": 86606343, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which of the following summarizes the central idea behind machine learning?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>Machine learning involves training algorithms on large datasets to identify patterns and make predictions or decisions based on new data</strong></p>\n\n<p>Machine learning works by training algorithms on large datasets, allowing them to identify patterns within the data. Once trained, these algorithms can make predictions or decisions when presented with new data, improving their performance over time as they are exposed to more data.</p>\n\n<p>The central idea behind machine learning is an existing mathematical relationship between any input and output data combination. The machine learning model does not know this relationship in advance but can guess if sufficient examples of input-output data sets are given. This means every machine learning algorithm is built around a modifiable math function. The underlying principle can be understood like this:</p>\n\n<p>We \u2018train\u2019 the algorithm by giving it the following input/output (i,o) combinations \u2013 (2,10), (5,19), and (9,31)\nThe algorithm computes the relationship between input and output to be: o=3*i+4\nWe then give it input 7 and ask it to predict the output. It can automatically determine the output as 25.</p>\n\n<p>While this is a basic understanding, machine learning focuses on the principle that computer systems can mathematically link all complex data points as long as they have sufficient data and computing power to process. Therefore, the accuracy of the output is directly co-relational to the magnitude of the input given. Machine learning phases are given below.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-aif-pt/assets/pt3-q25-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/what-is/machine-learning/\">https://aws.amazon.com/what-is/machine-learning/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Machine learning works by using predefined rules to generate outcomes without the need for data input</strong> - Machine learning does not rely on predefined rules alone; it uses data to learn and make predictions or decisions.</p>\n\n<p><strong>Machine learning is primarily based on hardware configurations and does not rely on software algorithms or data analysis</strong> - Machine learning is fundamentally based on software algorithms and data analysis rather than solely on hardware configurations.</p>\n\n<p><strong>Machine learning only functions effectively when data is manually labeled and categorized by humans</strong> - While labeled data can improve the performance of supervised learning models, machine learning can also function with unlabeled data through unsupervised learning methods.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/what-is/machine-learning/\">https://aws.amazon.com/what-is/machine-learning/</a></p>\n", "answers": ["<p>Machine learning involves training algorithms on large datasets to identify patterns and make predictions or decisions based on new data</p>", "<p>Machine learning works by using predefined rules to generate outcomes without the need for data input</p>", "<p>Machine learning is primarily based on hardware configurations and does not rely on software algorithms or data analysis</p>", "<p>Machine learning only functions effectively when data is manually labeled and categorized by humans</p>"]}, "correct_response": ["a"], "section": "Artificial Intelligence", "question_plain": "Which of the following summarizes the central idea behind machine learning?", "related_lectures": []}, {"_class": "assessment", "id": 86606345, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which of the following is correct regarding underfitting/overfitting in machine learning?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>Underfit models experience high bias, whereas, overfit models experience high variance</strong></p>\n\n<p>Your model is underfitting the training data when the model performs poorly on the training data. This is because the model is unable to capture the relationship between the input examples (often called X) and the target values (often called Y). Your model is overfitting your training data when you see that the model performs well on the training data but does not perform well on the evaluation data. This is because the model is memorizing the data it has seen and is unable to generalize to unseen examples.</p>\n\n<p>Underfit models experience high bias \u2014 they give inaccurate results for both the training data and test set. On the other hand, overfit models experience high variance - they give accurate results for the training set but not for the test set. More model training results in less bias but variance can increase. Data scientists aim to find the sweet spot between underfitting and overfitting when fitting a model. A well-fitted model can quickly establish the dominant trend for seen and unseen data sets.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Underfit models experience low bias, whereas, overfit models experience low variance</strong></p>\n\n<p><strong>Underfit models experience low bias, whereas, overfit models experience high variance</strong></p>\n\n<p><strong>Underfit models experience high bias, whereas, overfit models experience low variance</strong></p>\n\n<p>These three options contradict the explanation provided above, so these options are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/machine-learning/latest/dg/model-fit-underfitting-vs-overfitting.html\">https://docs.aws.amazon.com/machine-learning/latest/dg/model-fit-underfitting-vs-overfitting.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/what-is/overfitting/\">https://aws.amazon.com/what-is/overfitting/</a></p>\n", "answers": ["<p>Underfit models experience low bias, whereas, overfit models experience low variance</p>", "<p>Underfit models experience low bias, whereas, overfit models experience high variance</p>", "<p>Underfit models experience high bias, whereas, overfit models experience high variance</p>", "<p>Underfit models experience high bias, whereas, overfit models experience low variance</p>"]}, "correct_response": ["c"], "section": "Artificial Intelligence", "question_plain": "Which of the following is correct regarding underfitting/overfitting in machine learning?", "related_lectures": []}, {"_class": "assessment", "id": 86606347, "assessment_type": "multiple-choice", "prompt": {"question": "<p>What is the correct sequence of steps in the machine learning process?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>Data collection, Data preprocessing, Model training, Model evaluation</strong></p>\n\n<p>The machine learning process typically follows these steps:</p>\n\n<p>Data Collection: Gathering the necessary data from various sources.\nData Preprocessing: Cleaning and preparing the data for training, including handling missing values, normalizing data, and splitting it into training and test sets.\nModel Training: Using the preprocessed data to train a machine learning algorithm, resulting in a trained model.\nModel Evaluation: Assessing the performance of the trained model using a separate test set to ensure it generalizes well to new, unseen data.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-aif-pt/assets/pt3-q41-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/what-is/machine-learning/\">https://aws.amazon.com/what-is/machine-learning/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Data preprocessing, Model evaluation, Model training, Data collection</strong> - Data collection should be the first step, not the last.</p>\n\n<p><strong>Model training, Data collection, Data preprocessing, Model evaluation</strong> - Data collection should precede model training.</p>\n\n<p><strong>Model evaluation, Model training, Data collection, Data preprocessing</strong> - Model evaluation should come after model training, not before data collection and preprocessing.</p>\n\n<p>References:</p>\n", "answers": ["<p>Data preprocessing, Model evaluation, Model training, Data collection</p>", "<p>Model training, Data collection, Data preprocessing, Model evaluation</p>", "<p>Data collection, Data preprocessing, Model training, Model evaluation</p>", "<p>Model evaluation, Model training, Data collection, Data preprocessing</p>"]}, "correct_response": ["c"], "section": "Artificial Intelligence", "question_plain": "What is the correct sequence of steps in the machine learning process?", "related_lectures": []}, {"_class": "assessment", "id": 86606349, "assessment_type": "multiple-choice", "prompt": {"question": "<p>What type of cloud computing service is Amazon Rekognition?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>Software as a Service (SaaS)</strong></p>\n\n<p>Software as a Service (SaaS) delivers software applications over the internet, on-demand, and typically on a subscription basis. Amazon Rekognition is a SaaS as it provides image and video analysis services accessible over the internet without needing to manage the underlying infrastructure.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Infrastructure as a Service (IaaS)</strong> - Infrastructure as a Service (IaaS) provides virtualized computing resources over the internet, such as virtual machines, storage, and networks. Amazon Rekognition is not an IaaS.</p>\n\n<p><strong>Platform as a Service (PaaS)</strong> - Platform as a Service (PaaS) provides a platform allowing customers to develop, run, and manage applications without dealing with the infrastructure. Amazon Rekognition is not a PaaS.</p>\n\n<p><strong>Database as a Service (DBaaS)</strong> - Database as a Service (DBaaS) offers database management and operations as a service. Amazon Rekognition is not a DBaaS.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/rekognition/\">https://aws.amazon.com/rekognition/</a></p>\n", "answers": ["<p>Infrastructure as a Service (IaaS)</p>", "<p>Platform as a Service (PaaS)</p>", "<p>Software as a Service (SaaS)</p>", "<p>Database as a Service (DBaaS)</p>"]}, "correct_response": ["c"], "section": "Cloud Concepts", "question_plain": "What type of cloud computing service is Amazon Rekognition?", "related_lectures": []}, {"_class": "assessment", "id": 86606351, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which of the following represents the correct statement regarding Amazon Q Developer?</p>\n", "relatedLectureIds": "", "feedbacks": ["", "", "", ""], "explanation": "<p>Correct option:</p>\n\n<p><strong>Amazon Q Developer can be used in integrated development environments (IDEs) as well as the AWS Management Console</strong></p>\n\n<p>You can use Amazon Q Developer in the AWS Management Console, AWS Console Mobile Application, AWS Marketing website, AWS Documentation website, and chat channels integrated with AWS Chatbot to ask questions about AWS. You can ask Amazon Q about AWS architecture, best practices, support, and documentation. Amazon Q can also help with code that you're writing with the AWS SDKs and AWS Command Line Interface (AWS CLI).</p>\n\n<p>You can also use Amazon Q Developer in integrated development environments (IDEs) to learn about AWS and get assistance with your software development needs. In IDEs, Amazon Q includes capabilities to provide guidance and support across various aspects of software development, such as answering questions about building on AWS, generating and updating code, security scanning, and optimizing and refactoring code.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Amazon Q Developer can only be used in the integrated development environments (IDEs)</strong></p>\n\n<p><strong>Amazon Q Developer can only be used in the AWS Management Console</strong></p>\n\n<p><strong>Amazon Q Developer can neither be used in the integrated development environments (IDEs) nor the AWS Management Console</strong></p>\n\n<p>These three options contradict the explanation provided above, so these are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/q-on-aws.html\">https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/q-on-aws.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/q-in-IDE.html\">https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/q-in-IDE.html</a></p>\n", "answers": ["<p>Amazon Q Developer can be used in integrated development environments (IDEs) as well as the AWS Management Console</p>", "<p>Amazon Q Developer can only be used in the integrated development environments (IDEs)</p>", "<p>Amazon Q Developer can only be used in the AWS Management Console</p>", "<p>Amazon Q Developer can neither be used in the integrated development environments (IDEs) nor the AWS Management Console</p>"]}, "correct_response": ["a"], "section": "AWS AI Services", "question_plain": "Which of the following represents the correct statement regarding Amazon Q Developer?", "related_lectures": []}]};
      var correct = 0;
      var total = 0;
      const questionData = quizData.questions
      const passPercent = quizData.pass_percent

      function main() {
        total = questionData.length;

        var questions = [];
        for (var i = 0; i < questionData.length; i++) {
          var question = questionData[i];
          var questionText = question.prompt.question;
          var answers = question.prompt.answers;
          var correctAnswer = question.correct_response[0];
          var correctAnswerText = answers[correctAnswer.charCodeAt(0) - 97];
          var questionObj = {
            question: questionText,
            correctAnswer: correctAnswerText,
            answers: answers,
            id: question.id,
          };
          questions.push(questionObj);
        }

        updateScore();

        // display the questions
        var questionsContainer = document.getElementById("quiz-container");
        for (var i = 0; i < questions.length; i++) {
          var question = questions[i];
          var questionElement = document.createElement("form");
          questionElement.className = "question";
          questionElement.innerHTML =
            "<span>Question " +
            (i + 1) +
            ":</span>" +
            '<div class="question-prompt">' +
            question.question +
            "</div>";
          questionElement.id = question.id;
          questionElement.classList.add("quiz-container");
          var answersElement = document.createElement("ul");
          answersElement.className = "answers";
          for (var j = 0; j < question.answers.length; j++) {
            var answer = question.answers[j];
            var answerElement = document.createElement("li");
            answerElement.className = "answer";
            answerElement.innerHTML =
              '<label for="input-' +
              question.id +
              "-" +
              j +
              '"><div onclick="select(' +
              question.id +
              ", " +
              j +
              ')"><span></span><input id="input-' +
              question.id +
              "-" +
              j +
              '" type="radio" name="question' +
              i +
              '" value="' +
              j +
              '">' +
              answer +
              "</input></div></label>";
            answerElement.classList.add("question-answer");
            answersElement.appendChild(answerElement);
          }

          questionElement.appendChild(answersElement);

          // add a submit button
          var submitButton = document.createElement("button");
          submitButton.className = "submit";
          submitButton.innerHTML = "Submit";
          submitButton.classList.add("submit-button");

          submitButton.addEventListener("click", function (e) {
            e.preventDefault();
            var questionElement = e.target.parentElement;
            var questionId = questionElement.id;
            var question = questions.filter(function (q) {
              return q.id == questionId;
            })[0];

            // set the border color of all answers to black
            var answers = questionElement.getElementsByClassName("answer");
            for (var i = 0; i < answers.length; i++) {
              console.log(answers[i]);
              answers[i].children[0].style.borderColor = "#1c1d1f";
            }

            var answer = questionElement.querySelector(
              'input[type="radio"]:checked'
            );
            if (answer) {
              var answerIndex = answer.value;
              var answerText = question.answers[answerIndex];
              if (answerText == question.correctAnswer) {
                answer.parentElement.parentElement.style.borderColor =
                  "limegreen";
                // alert("Correct!");
                correct++;
                updateScore();
              } else {
                answer.parentElement.parentElement.style.borderColor = "red";
                // alert("Incorrect!");
              }
            } else {
              alert("Please select an answer.");
            }
          });

          // add button
          questionElement.appendChild(submitButton);

          questionsContainer.appendChild(questionElement);
        }
      }

      function select(question, answer) {
        var questionElement = document.getElementById(question);
        var answers = questionElement.getElementsByClassName("answer");
        for (var i = 0; i < answers.length; i++) {
          var span = answers[i].children[0].children[0].children[0];
          var input = answers[i].children[0].children[0].children[1];
          span.classList.remove("selected");
          input.checked = false;
        }
        var span = answers[answer].children[0].children[0].children[0];
        var input = answers[answer].children[0].children[0].children[1];
        span.classList.add("selected");
        input.checked = true;
      }

      function updateScore() {
        var scoreElem = document.getElementById("score");
        const score = (correct / total) * 100;
        scoreElem.innerHTML = "Score: " + score + "/" + passPercent + "%";
      }
    </script>
  </body>
</html>
